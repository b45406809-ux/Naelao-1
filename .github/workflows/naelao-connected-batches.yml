name: Naelao connected service batches
on:
  push:
    branches: [work]
    paths: ['.github/workflows/naelao-connected-batches.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [identity-notifications, workspace-core, agent-execution, api-edge]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Stage agent dependencies
        if: contains(fromJSON('["agent-execution","api-edge"]'), matrix.batch)
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'; import { dirname, join, resolve } from 'node:path'; import { cpSync, mkdirSync } from 'node:fs';
          const root=process.cwd(), req=createRequire(join(root,'workers/agents/package.json')), target=join(root,'workers/agents/container/.vendor/node_modules'), platform=`@esbuild/${process.platform}-${process.arch}`;
          mkdirSync(join(target,'@esbuild'),{recursive:true}); cpSync(dirname(req.resolve('esbuild/package.json')),join(target,'esbuild'),{recursive:true,dereference:true}); cpSync(resolve(root,'node_modules/.pnpm/node_modules',platform),join(target,platform),{recursive:true,dereference:true});
          NODE
      - name: Start bound workers and capture bindings
        env:
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/connected"
          export PERSIST_DIR="$RUNNER_TEMP/connected/state"
          case "$BATCH" in
            identity-notifications) workers='notifications auth credentials' ;;
            workspace-core) workers='notifications ws-gateway billing agents knowledge spaces' ;;
            agent-execution) workers='notifications ws-gateway billing credentials artifact browser mcp-hub agents knowledge spaces' ;;
            api-edge) workers='notifications ws-gateway billing credentials artifact browser mcp-hub agents knowledge spaces auth analytics eval marketplace portal-router router' ;;
          esac
          pids=''
          for w in $workers; do
            port=18$(printf '%02d' $(( $(echo "$workers" | tr ' ' '\n' | grep -n "^$w$" | cut -d: -f1) + 1 )))
            pnpm exec wrangler dev --local --config "workers/$w/wrangler.toml" --port "$port" --inspector-port "$((port+10000))" --persist-to "$PERSIST_DIR" --var JWT_SECRET:local-test-secret --var PLATFORM_SECRET:local-test-secret --var CREDENTIAL_ENCRYPTION_KEY:v1:$(printf '00%.0s' {1..32}) > "$RUNNER_TEMP/connected/$w.log" 2>&1 &
            pids="$pids $!"
          done
          ready=0
          for i in $(seq 1 60); do
            sleep 5
            echo "sample=$i batch=$BATCH"
            free -m; df -m .; ps -eo pid,ppid,rss,comm --sort=-rss | head -20
            rg -n 'Worker \[connected\]|Worker \[not connected\]|Ready on|ERROR|failed to build' "$RUNNER_TEMP/connected"/*.log || true
            alive=1; for p in $pids; do kill -0 "$p" 2>/dev/null || alive=0; done
            if [ "$alive" = 1 ] && [ "$i" -ge 5 ]; then ready=1; break; fi
          done
          for p in $pids; do kill "$p" 2>/dev/null || true; done
          for f in "$RUNNER_TEMP/connected"/*.log; do echo "--- $f"; tail -80 "$f"; done
          test "$ready" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-${{ matrix.batch }}
          path: ${{ runner.temp }}/connected/*.log
          if-no-files-found: ignore
