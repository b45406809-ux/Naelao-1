name: Naelao connected service batches
on:
  push:
    branches: [work]
    paths: ['.github/workflows/naelao-connected-batches.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binding-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Probe a real service binding
        shell: bash
        run: |
          mkdir -p .probe "$RUNNER_TEMP/probe"
          cat > .probe/index.mjs <<'JS'
          export default { async fetch(request, env) { const response = await env.TARGET.fetch('http://internal/health'); return new Response(JSON.stringify({targetStatus: response.status, targetBody: await response.text()}), {headers: {'content-type':'application/json'}}); } };
          JS
          cat > .probe/wrangler.toml <<'TOML'
          name = "naelao-binding-probe"
          main = "index.mjs"
          compatibility_date = "2026-09-29"
          [[services]]
          binding = "TARGET"
          service = "naelao-notifications"
          TOML
          printf "RESEND_API_KEY=test-only-not-a-real-key\nWEBHOOK_SIGNING_SECRET=test-only-signing-secret\n" > workers/notifications/.dev.vars
          export WRANGLER_SEND_METRICS=false
          pnpm exec wrangler dev --local -c .probe/wrangler.toml -c workers/notifications/wrangler.toml --port 18800 --persist-to "$RUNNER_TEMP/probe/state" > "$RUNNER_TEMP/probe/wrangler.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            echo "sample=$i"
            free -m; df -m .; ps -eo pid,ppid,rss,comm --sort=-rss | head -15
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:18800/ > "$RUNNER_TEMP/probe/response.json"; then
              cat "$RUNNER_TEMP/probe/response.json"
              if node -e 'const v=require(process.argv[1]); process.exit(v.targetStatus === 404 ? 0 : 1)' "$RUNNER_TEMP/probe/response.json"; then ok=1; break; fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
          done
          cat "$RUNNER_TEMP/probe/wrangler.log"
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binding-probe
          path: ${{ runner.temp }}/probe/*
          if-no-files-found: ignore
  router-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Verify router calls auth and spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/router-probe"
          for worker in router auth spaces; do
            printf 'JWT_SECRET=local-test-secret\nPLATFORM_SECRET=local-test-secret\nCREDENTIAL_ENCRYPTION_KEY=v1:%s\n' "$(printf '00%.0s' {1..32})" > "workers/$worker/.dev.vars"
          done
          trap 'rm -f workers/router/.dev.vars workers/auth/.dev.vars workers/spaces/.dev.vars; kill "$pid" 2>/dev/null || true' EXIT
          export WRANGLER_SEND_METRICS=false
          pnpm exec wrangler dev --local -c workers/router/wrangler.toml -c workers/auth/wrangler.toml -c workers/spaces/wrangler.toml --port 18800 --persist-to "$RUNNER_TEMP/router-probe/state" --var JWT_SECRET:local-test-secret --var PLATFORM_SECRET:local-test-secret --var CREDENTIAL_ENCRYPTION_KEY:v1:$(printf '00%.0s' {1..32}) > "$RUNNER_TEMP/router-probe/wrangler.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            echo "sample=$i"; free -m; df -m .; ps -eo pid,ppid,rss,comm --sort=-rss | head -15
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18800/health/dependencies > "$RUNNER_TEMP/router-probe/response.json"; then
              cat "$RUNNER_TEMP/router-probe/response.json"
              if node -e 'const x=require(process.argv[1]); process.exit(x.ok && ["auth","spaces"].every(n => x.services.some(s => s.service === n && s.status === 200 && s.ok)) ? 0 : 1)' "$RUNNER_TEMP/router-probe/response.json"; then ok=1; break; fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
          done
          cat "$RUNNER_TEMP/router-probe/wrangler.log"
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-dependencies
          path: ${{ runner.temp }}/router-probe/*
          if-no-files-found: ignore
  agent-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Prepare sandbox dependencies
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'; import { dirname, join, resolve } from 'node:path'; import { cpSync, mkdirSync } from 'node:fs';
          const root=process.cwd(), req=createRequire(join(root,'workers/agents/package.json')), target=join(root,'workers/agents/container/.vendor/node_modules'), platform=`@esbuild/${process.platform}-${process.arch}`;
          mkdirSync(join(target,'@esbuild'),{recursive:true}); cpSync(dirname(req.resolve('esbuild/package.json')),join(target,'esbuild'),{recursive:true,dereference:true}); cpSync(resolve(root,'node_modules/.pnpm/node_modules',platform),join(target,platform),{recursive:true,dereference:true});
          NODE
      - name: Verify unauthorized agent requests are rejected
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agent-test"
          export WRANGLER_SEND_METRICS=false
          pnpm exec wrangler dev --local -c workers/agents/wrangler.toml --port 18800 --persist-to "$RUNNER_TEMP/agent-test/state" --var JWT_SECRET:local-test-secret --var PLATFORM_SECRET:local-test-secret --var CREDENTIAL_ENCRYPTION_KEY:v1:$(printf '00%.0s' {1..32}) > "$RUNNER_TEMP/agent-test/worker.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          status=000
          for i in $(seq 1 80); do
            sleep 3
            status=$(curl -s -o "$RUNNER_TEMP/agent-test/no-identity.json" -w '%{http_code}' --max-time 3 -X POST -H 'content-type: application/json' --data '{"goal":"test"}' http://127.0.0.1:18800/spaces/test/sessions/test/agent/run || true)
            echo "sample=$i status=$status"; free -m; df -m .
            if [ "$status" != 000 ]; then break; fi
            kill -0 "$pid" 2>/dev/null || break
          done
          cat "$RUNNER_TEMP/agent-test/worker.log"
          test "$status" = 401
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/forged.json" -w '%{http_code}' --max-time 10 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-internal-token: forged' --data '{"goal":"test"}' http://127.0.0.1:18800/spaces/test/sessions/test/agent/run)
          echo "forged_status=$status"
          cat "$RUNNER_TEMP/agent-test/forged.json"
          test "$status" = 401
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-authorization
          path: ${{ runner.temp }}/agent-test/*
          if-no-files-found: ignore
