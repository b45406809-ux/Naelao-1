name: Naelao connected service batches
# Includes tenant-scoped daily budget forwarding.
on:
  push:
    branches: [work]
    paths: ['.github/workflows/naelao-connected-batches.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  binding-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Probe a real service binding
        shell: bash
        run: |
          mkdir -p .probe "$RUNNER_TEMP/probe"
          cat > .probe/index.mjs <<'JS'
          export default { async fetch(request, env) { const response = await env.TARGET.fetch('http://internal/health'); return new Response(JSON.stringify({targetStatus: response.status, targetBody: await response.text()}), {headers: {'content-type':'application/json'}}); } };
          JS
          cat > .probe/wrangler.toml <<'TOML'
          name = "naelao-binding-probe"
          main = "index.mjs"
          compatibility_date = "2026-09-29"
          [[services]]
          binding = "TARGET"
          service = "naelao-notifications"
          TOML
          printf "RESEND_API_KEY=test-only-not-a-real-key\nWEBHOOK_SIGNING_SECRET=test-only-signing-secret\n" > workers/notifications/.dev.vars
          export WRANGLER_SEND_METRICS=false
          pnpm exec wrangler dev --local -c .probe/wrangler.toml -c workers/notifications/wrangler.toml --port 18800 --persist-to "$RUNNER_TEMP/probe/state" > "$RUNNER_TEMP/probe/wrangler.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            echo "sample=$i"
            free -m; df -m .; ps -eo pid,ppid,rss,comm --sort=-rss | head -15
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:18800/ > "$RUNNER_TEMP/probe/response.json"; then
              cat "$RUNNER_TEMP/probe/response.json"
              if node -e 'const v=require(process.argv[1]); process.exit(v.targetStatus === 404 ? 0 : 1)' "$RUNNER_TEMP/probe/response.json"; then ok=1; break; fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
          done
          cat "$RUNNER_TEMP/probe/wrangler.log"
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binding-probe
          path: ${{ runner.temp }}/probe/*
          if-no-files-found: ignore
  router-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Verify router calls auth and spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/router-probe"
          for worker in router auth spaces; do
            printf 'JWT_SECRET=local-test-secret\nPLATFORM_SECRET=local-test-secret\nCREDENTIAL_ENCRYPTION_KEY=v1:%s\n' "$(printf '00%.0s' {1..32})" > "workers/$worker/.dev.vars"
          done
          trap 'rm -f workers/router/.dev.vars workers/auth/.dev.vars workers/spaces/.dev.vars; kill "$pid" 2>/dev/null || true' EXIT
          export WRANGLER_SEND_METRICS=false
          pnpm exec wrangler dev --local -c workers/router/wrangler.toml -c workers/auth/wrangler.toml -c workers/spaces/wrangler.toml --port 18800 --persist-to "$RUNNER_TEMP/router-probe/state" --var JWT_SECRET:local-test-secret --var PLATFORM_SECRET:local-test-secret --var CREDENTIAL_ENCRYPTION_KEY:v1:$(printf '00%.0s' {1..32}) > "$RUNNER_TEMP/router-probe/wrangler.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            echo "sample=$i"; free -m; df -m .; ps -eo pid,ppid,rss,comm --sort=-rss | head -15
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18800/health/dependencies > "$RUNNER_TEMP/router-probe/response.json"; then
              cat "$RUNNER_TEMP/router-probe/response.json"
              if node -e 'const x=require(process.argv[1]); process.exit(x.ok && ["auth","spaces"].every(n => x.services.some(s => s.service === n && s.status === 200 && s.ok)) ? 0 : 1)' "$RUNNER_TEMP/router-probe/response.json"; then ok=1; break; fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
          done
          cat "$RUNNER_TEMP/router-probe/wrangler.log"
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-dependencies
          path: ${{ runner.temp }}/router-probe/*
          if-no-files-found: ignore
  agent-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Prepare sandbox dependencies
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'; import { dirname, join, resolve } from 'node:path'; import { cpSync, mkdirSync } from 'node:fs';
          const root=process.cwd(), req=createRequire(join(root,'workers/agents/package.json')), target=join(root,'workers/agents/container/.vendor/node_modules'), platform=`@esbuild/${process.platform}-${process.arch}`;
          mkdirSync(join(target,'@esbuild'),{recursive:true}); cpSync(dirname(req.resolve('esbuild/package.json')),join(target,'esbuild'),{recursive:true,dereference:true}); cpSync(resolve(root,'node_modules/.pnpm/node_modules',platform),join(target,platform),{recursive:true,dereference:true});
          NODE
      - name: Verify unauthorized agent requests are rejected
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agent-test"
          export WRANGLER_SEND_METRICS=false
          printf 'JWT_SECRET=local-test-secret\nPLATFORM_SECRET=local-test-secret\n' > workers/spaces/.dev.vars
          # Run the actual org, usage and token-reservation schema used by the billing worker.
          # The earlier harness omitted BILLING_WORKER and then treated its fail-closed response
          # as an agent failure, so it never tested durable execution past admission.
          for migration in 0002_orgs.sql 0004_billing.sql 0007_billing_meters.sql 0032_usage_events_idempotency.sql 0072_org_quota_overage.sql 0098_llm_token_reservations.sql 0109_usage_events_v2.sql 0152_decision_call_reservations.sql; do
            pnpm exec wrangler d1 execute naelao-platform --local -c workers/agents/wrangler.toml --persist-to "$RUNNER_TEMP/agent-test/state" --file "infra/migrations/$migration"
          done
          pnpm exec wrangler d1 execute naelao-platform --local -c workers/agents/wrangler.toml --persist-to "$RUNNER_TEMP/agent-test/state" --command "CREATE TABLE IF NOT EXISTS spaces (id TEXT PRIMARY KEY, tenant_id TEXT, status TEXT, config_json TEXT, parent_space_id TEXT); INSERT INTO orgs (id,name,owner_id,plan_tier,status) VALUES ('test-tenant','Local test tenant','test-user','growth','active'); INSERT INTO spaces (id,tenant_id,status,config_json) VALUES ('test-space','test-tenant','active','{\"model_policy\":{\"mode\":\"whitelist_only\",\"allowedModelIds\":[\"@cf/meta/llama-3.3-70b-instruct-fp8-fast\"]}}');"
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          for name in ('agents', 'spaces'):
              source = Path(f'workers/{name}/wrangler.toml').read_text()
              source = re.sub(r'(?m)^\[ai\]\s*\nbinding\s*=\s*"AI"\s*\n', '', source)
              if name == 'agents':
                  source = source.replace('binding = "AGENTS_WORKER"\nservice = "naelao-agents"', 'binding = "AGENTS_WORKER"\nservice = "naelao-agent-gate"', 1)
              Path(f'workers/{name}/wrangler.ci.toml').write_text(source)
          PYCODE
          mkdir -p .agent-probe
          cat > .agent-probe/index.mjs <<'JS'
          export default { fetch(request, env) { const url = new URL(request.url); if (url.pathname.startsWith('/gate/')) return env.GATE.fetch(new Request(`https://agent-gate${url.pathname}${url.search}`, request)); const target = url.pathname.startsWith('/agent/') ? env.AGENTS : env.SPACES; url.pathname = url.pathname.replace(/^\/(agent|space)/, ''); return target.fetch(new Request(url, request)); } };
          JS
          cat > .agent-probe/gate.mjs <<'JS'
          import { DurableObject } from 'cloudflare:workers';
          export class AgentGateDO extends DurableObject {
            constructor(ctx, env) { super(ctx, env); this.releaseCurrent = undefined; }
            async fetch(request) {
            const url = new URL(request.url);
            if (url.pathname === '/control/state') return Response.json({ call_count: await this.ctx.storage.get('call_count') ?? 0, state: await this.ctx.storage.get('state') ?? 'idle' });
            if (url.pathname.startsWith('/internal/tasks/') && url.pathname.endsWith('/run') && request.method === 'POST') {
              const callCount = (await this.ctx.storage.get('call_count') ?? 0) + 1;
              await this.ctx.storage.put('call_count', callCount);
              await this.ctx.storage.put('state', 'blocked');
              await new Promise(resolve => { this.releaseCurrent = resolve; });
              await this.ctx.storage.put('state', 'released');
              return Response.json({ status: 'completed', final_answer: 'local restart fixture completed', created_artifacts_json: '[]', citations_json: '[]', host_actions_json: '[]' });
            }
            return Response.json({ error: 'not_found' }, { status: 404 });
            }
          }
          export default { fetch(request, env) { const url = new URL(request.url); if (url.pathname.startsWith('/gate/')) url.pathname = url.pathname.slice('/gate'.length); return env.GATE_DO.get(env.GATE_DO.idFromName('restart-fixture')).fetch(new Request(url, request)); } };
          JS
          cat > .agent-probe/wrangler.toml <<'TOML'
          name = "naelao-agent-probe"
          main = "index.mjs"
          compatibility_date = "2026-09-29"
          [[services]]
          binding = "GATE"
          service = "naelao-agent-gate"
          [[services]]
          binding = "AGENTS"
          service = "naelao-agents"
          [[services]]
          binding = "SPACES"
          service = "naelao-spaces"
          TOML
          cat > .agent-probe/gate.wrangler.toml <<'TOML'
          name = "naelao-agent-gate"
          main = "gate.mjs"
          compatibility_date = "2026-09-29"
          [[durable_objects.bindings]]
          name = "GATE_DO"
          class_name = "AgentGateDO"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["AgentGateDO"]
          TOML
          build_id=$(git rev-parse HEAD | sha256sum | cut -d' ' -f1)
          printf 'JWT_SECRET=local-test-secret\nPLATFORM_SECRET=local-test-secret\nWORKFLOW_BUILD_ID=%s\n' "$build_id" > workers/agents/.dev.vars
          printf 'PLATFORM_SECRET=local-test-secret\n' > workers/billing/.dev.vars
          start_agent_workers() {
            local log_file="$1"
            setsid pnpm exec wrangler dev --local -c .agent-probe/wrangler.toml -c .agent-probe/gate.wrangler.toml -c workers/agents/wrangler.ci.toml -c workers/spaces/wrangler.ci.toml -c workers/billing/wrangler.toml --port 18800 --persist-to "$RUNNER_TEMP/agent-test/state" --var JWT_SECRET:local-test-secret --var PLATFORM_SECRET:local-test-secret --var CREDENTIAL_ENCRYPTION_KEY:v1:$(printf '00%.0s' {1..32}) > "$log_file" 2>&1 &
            pid=$!
          }
          stop_agent_workers() {
            if [ -n "${pid:-}" ]; then
              kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              pid=""
            fi
          }
          start_agent_workers "$RUNNER_TEMP/agent-test/worker.log"
          trap 'rm -f workers/agents/.dev.vars workers/spaces/.dev.vars workers/billing/.dev.vars workers/agents/wrangler.ci.toml workers/spaces/wrangler.ci.toml; if [ -n "${pid:-}" ]; then kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true; fi' EXIT
          status=000
          for i in $(seq 1 80); do
            sleep 3
            status=$(curl -s -o "$RUNNER_TEMP/agent-test/no-identity.json" -w '%{http_code}' --max-time 3 -X POST -H 'content-type: application/json' --data '{"goal":"test"}' http://127.0.0.1:18800/agent/spaces/test/sessions/test/agent/run || true)
            echo "sample=$i status=$status"; free -m; df -m .
            if [ "$status" != 000 ]; then break; fi
            kill -0 "$pid" 2>/dev/null || break
          done
          cat "$RUNNER_TEMP/agent-test/worker.log"
          test "$status" = 401
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/forged.json" -w '%{http_code}' --max-time 10 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-internal-token: forged' --data '{"goal":"test"}' http://127.0.0.1:18800/agent/spaces/test/sessions/test/agent/run)
          echo "forged_status=$status"
          cat "$RUNNER_TEMP/agent-test/forged.json"
          test "$status" = 401
          token=$(node -e 'const c=require("node:crypto"), t=Date.now().toString(), sig=c.createHmac("sha256","local-test-secret").update(`internal:test-tenant:${t}`).digest("hex"); process.stdout.write(`t=${t},v1=${sig}`)')
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/signed.json" -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H "x-naelao-internal-token: $token" --data '{"goal":"test"}' http://127.0.0.1:18800/agent/spaces/test-space/sessions/missing-session/agent/run)
          echo "signed_status=$status"; cat "$RUNNER_TEMP/agent-test/signed.json"
          test "$status" = 404
          node -e 'const x=require(process.argv[1]); if(x.error_code !== "session_unavailable") process.exit(1)' "$RUNNER_TEMP/agent-test/signed.json"
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/session.json" -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" --data '{"id":"test-session"}' http://127.0.0.1:18800/space/spaces/test-space/sessions)
          echo "create_session_status=$status"; cat "$RUNNER_TEMP/agent-test/session.json"; test "$status" = 201
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/member.json" -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" --data '{"space_id":"test-space","user_id":"test-user","role":"owner"}' http://127.0.0.1:18800/space/spaces/test-space/members)
          echo "create_member_status=$status"; cat "$RUNNER_TEMP/agent-test/member.json"; test "$status" = 201
          for file in agents.md system-prompt.md scripts.json skills.json; do
            case "$file" in scripts.json) printf '{"prebuilt":[],"startup_observe":""}' > "$RUNNER_TEMP/agent-test/$file" ;; skills.json) printf '{"skills":[]}' > "$RUNNER_TEMP/agent-test/$file" ;; *) printf 'Test agent' > "$RUNNER_TEMP/agent-test/$file" ;; esac
            pnpm exec wrangler r2 object put "naelao-agent-scripts/spaces/test-space/agents/naelao-agent/$file" --local -c workers/agents/wrangler.toml --persist-to "$RUNNER_TEMP/agent-test/state" --file "$RUNNER_TEMP/agent-test/$file"
          done
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/valid-session.json" -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" --data '{"goal":"test","project_id":"wrong-project"}' http://127.0.0.1:18800/agent/spaces/test-space/sessions/test-session/agent/run)
          echo "valid_session_status=$status"; cat "$RUNNER_TEMP/agent-test/valid-session.json"; test "$status" = 403
          node -e 'const x=require(process.argv[1]); if(x.error_code !== "project_session_scope_mismatch") process.exit(1)' "$RUNNER_TEMP/agent-test/valid-session.json"
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/policy.json" -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" --data '{"goal":"steps to commit terrorism"}' http://127.0.0.1:18800/agent/spaces/test-space/sessions/test-session/agent/run)
          echo "policy_status=$status"; cat "$RUNNER_TEMP/agent-test/policy.json"; test "$status" = 400
          node -e 'const x=require(process.argv[1]); if(x.error_code !== "content_blocked") process.exit(1)' "$RUNNER_TEMP/agent-test/policy.json"
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/model-policy.json" -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" --data '{"goal":"Summarize my notes","model":"local/not-allowed"}' http://127.0.0.1:18800/agent/spaces/test-space/sessions/test-session/agent/run)
          echo "model_policy_status=$status"; cat "$RUNNER_TEMP/agent-test/model-policy.json"; test "$status" = 400
          node -e 'const x=require(process.argv[1]); if(x.error_code !== "compliance_violation") process.exit(1)' "$RUNNER_TEMP/agent-test/model-policy.json"
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/accepted.json" -w '%{http_code}' --max-time 30 -X POST -H 'content-type: application/json' -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" --data '{"goal":"Summarize my notes"}' http://127.0.0.1:18800/agent/spaces/test-space/sessions/test-session/agent/run)
          echo "accepted_status=$status"; cat "$RUNNER_TEMP/agent-test/accepted.json"; test "$status" = 202
          node -e 'const x=require(process.argv[1]); if(x.status !== "queued" || !x.task_id) process.exit(1)' "$RUNNER_TEMP/agent-test/accepted.json"
          task_id=$(node -p 'require(process.argv[1]).task_id' "$RUNNER_TEMP/agent-test/accepted.json")
          pre_restart_state=queued
          for i in $(seq 1 40); do
            status=$(curl -s -o "$RUNNER_TEMP/agent-test/pre-restart-$i.json" -w '%{http_code}' --max-time 5 -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" "http://127.0.0.1:18800/agent/spaces/test-space/tasks/$task_id" || true)
            if [ "$status" = 200 ]; then pre_restart_state=$(node -p 'require(process.argv[1]).status || "unknown"' "$RUNNER_TEMP/agent-test/pre-restart-$i.json"); fi
            case "$pre_restart_state" in processing|complete|failed) cp "$RUNNER_TEMP/agent-test/pre-restart-$i.json" "$RUNNER_TEMP/agent-test/pre-restart-task.json"; break ;; esac
            sleep 0.5
          done
          echo "accepted_task_id=$task_id; pre_restart_state=$pre_restart_state"
          test "$pre_restart_state" = processing
          gate_ready=0
          for i in $(seq 1 40); do
            status=$(curl -s -o "$RUNNER_TEMP/agent-test/gate-before-restart.json" -w '%{http_code}' --max-time 5 http://127.0.0.1:18800/gate/control/state || true)
            if [ "$status" = 200 ] && node -e 'const x=require(process.argv[1]); process.exit(x.call_count === 1 && x.state === "blocked" ? 0 : 1)' "$RUNNER_TEMP/agent-test/gate-before-restart.json"; then gate_ready=1; break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/agent-test/gate-before-restart.json"
          test "$gate_ready" = 1
          echo "terminating local Workers after dispatch began and before first result retrieval"
          stop_agent_workers
          sleep 2
          start_agent_workers "$RUNNER_TEMP/agent-test/worker-after-restart.log"
          token=$(node -e 'const c=require("node:crypto"), t=Date.now().toString(), sig=c.createHmac("sha256","local-test-secret").update(`internal:test-tenant:${t}`).digest("hex"); process.stdout.write(`t=${t},v1=${sig}`)')
          restart_ready=0
          for i in $(seq 1 60); do
            status=$(curl -s -o "$RUNNER_TEMP/agent-test/restart-poll.json" -w '%{http_code}' --max-time 5 -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" "http://127.0.0.1:18800/agent/spaces/test-space/tasks/$task_id" || true)
            if [ "$status" = 200 ]; then restart_ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          test "$restart_ready" = 1
          echo "task_receipt_recovered_after_worker_restart=true"
          for i in $(seq 1 24); do
            status=$(curl -s -o "$RUNNER_TEMP/agent-test/task-$i.json" -w '%{http_code}' --max-time 10 -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" "http://127.0.0.1:18800/agent/spaces/test-space/tasks/$task_id")
            echo "task_poll=$i http=$status"; cat "$RUNNER_TEMP/agent-test/task-$i.json"; echo
            test "$status" = 200
            state=$(node -p 'require(process.argv[1]).status || "unknown"' "$RUNNER_TEMP/agent-test/task-$i.json")
            case "$state" in complete|failed) break ;; esac
            sleep 5
          done
          echo "observed_task_state=$state"
          if [ "$state" != complete ] && [ "$state" != failed ]; then tail -n 200 "$RUNNER_TEMP/agent-test/worker.log"; fi
          # The test gate replaces only the model execution service. The workflow must not retry
          # an uncertain in-flight tool/model step after its durable claim; the task should end
          # in explicit reconciliation failure, and duplicate polling must return that receipt.
          test "$state" = failed
          node -e 'const x=require(process.argv[1]); if(!/workflow_agent_run_reconciliation_required/.test(x.error || "")) process.exit(1)' "$RUNNER_TEMP/agent-test/task-$i.json"
          if [ "$state" = failed ]; then
            node -e 'const x=require(process.argv[1]); if(!x.error || /reservation_unavailable|no inference was sent/.test(x.error)) process.exit(1)' "$RUNNER_TEMP/agent-test/task-$i.json"
          fi
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/repeated-poll.json" -w '%{http_code}' --max-time 10 -H 'x-naelao-tenant-id: test-tenant' -H 'x-naelao-user-id: test-user' -H 'x-naelao-role: owner' -H "x-naelao-internal-token: $token" "http://127.0.0.1:18800/agent/spaces/test-space/tasks/$task_id")
          test "$status" = 200
          node -e 'const a=require(process.argv[1]),b=require(process.argv[2]); if(a.task_id!==b.task_id || a.status!==b.status || JSON.stringify(a.result)!==JSON.stringify(b.result) || a.error!==b.error) process.exit(1)' "$RUNNER_TEMP/agent-test/task-$i.json" "$RUNNER_TEMP/agent-test/repeated-poll.json"
          status=$(curl -s -o "$RUNNER_TEMP/agent-test/gate-after-restart.json" -w '%{http_code}' --max-time 5 http://127.0.0.1:18800/gate/control/state)
          test "$status" = 200
          node -e 'const x=require(process.argv[1]); if(x.call_count!==1 || x.state!=="blocked") process.exit(1)' "$RUNNER_TEMP/agent-test/gate-after-restart.json"
          echo "duplicate_task_poll_same_terminal_receipt=true"
          echo "restarted_inflight_run_failed_closed_without_reexecution=true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-authorization
          path: ${{ runner.temp }}/agent-test/*
          if-no-files-found: ignore
