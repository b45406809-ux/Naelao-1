name: Implement full plan with Goal-Mode Agent

on:
  workflow_dispatch:
    inputs:
      start_phase:
        description: "First micro-phase (1-67)"
        required: true
        default: "1"
      end_phase:
        description: "Last micro-phase (1-67)"
        required: true
        default: "67"
      providers:
        description: "Comma-separated provider rotation (ordered by priority)"
        required: true
        default: "gemini,openrouter,groq"
      max_turns_per_phase:
        description: "Maximum agent goal iterations per phase"
        required: true
        default: "20"
      compact_tokens:
        description: "Base token threshold for auto-compaction"
        required: true
        default: "45000"
      verify_command:
        description: "Final verification command before commit"
        required: true
        default: "pnpm typecheck && pnpm test"

concurrency:
  group: implement-full-plan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      AI_PROVIDERS: ${{ inputs.providers }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      MAX_TURNS_PER_PHASE: ${{ inputs.max_turns_per_phase }}
      COMPACT_TOKENS: ${{ inputs.compact_tokens }}
      PHASE_VERIFY_COMMAND: ${{ inputs.verify_command }}
      BRANCH_NAME: ai/goal-mode-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate API key configuration
        run: |
          test -n "$GEMINI_API_KEYS$GROQ_API_KEYS$OPENROUTER_API_KEYS" || {
            echo "::error::At least one provider API key secret is required (GEMINI_API_KEYS, GROQ_API_KEYS, or OPENROUTER_API_KEYS)" >&2
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create accumulator branch
        run: |
          git config user.name "naelao-plan-bot"
          git config user.email "naelao-plan-bot@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"

      - name: Run Autonomous Goal Agent
        run: >-
          node goal-agent.mjs
          --start "${{ inputs.start_phase }}"
          --end "${{ inputs.end_phase }}"
          --providers "${{ inputs.providers }}"
          --max-turns "${{ inputs.max_turns_per_phase }}"
          --compact-tokens "${{ inputs.compact_tokens }}"
          --verify "${{ inputs.verify_command }}"

      - name: Push accumulator branch
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: save in-progress phase runs [skip ci]" || true
          fi
          git push --set-upstream origin "$BRANCH_NAME" || true

      - name: Upload phase runs & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .phase-runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH_NAME" \
            --title "Implement plan phases ${{ inputs.start_phase }}-${{ inputs.end_phase }} (Goal Mode)" \
            --body-file <(cat <<'EOF'
          Automated sequential implementation via Goal-Mode Agent.

          - Phases: ${{ inputs.start_phase }} through ${{ inputs.end_phase }}
          - Model Providers: ${{ inputs.providers }}
          - Verification: `${{ inputs.verify_command }}`

          All micro-phases were implemented, verified, and committed iteratively using tool calling,
          in-memory indexing, and automatic context compaction.
          EOF
          )
