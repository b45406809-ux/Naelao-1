name: Implement full plan with rotating AI models

on:
  workflow_dispatch:
    inputs:
      start_phase:
        description: First micro-phase (1-67)
        required: true
        default: "1"
      end_phase:
        description: Last micro-phase (1-67)
        required: true
        default: "67"
      providers:
        description: Comma-separated provider rotation
        required: true
        default: "gemini,groq,openrouter"
      max_turns_per_phase:
        description: Maximum patch/continuation turns per phase
        required: true
        default: "12"
      hard_input_tokens:
        description: Maximum input tokens allowed per prompt slice
        required: true
        default: "400000"
      max_file_size:
        description: Maximum file size in bytes to include in full
        required: true
        default: "450000"
      verify_command:
        description: Command run before each phase commit
        required: true
        default: "pnpm typecheck && pnpm test"

concurrency:
  group: implement-full-plan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      AI_PROVIDERS: ${{ inputs.providers }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      MAX_TURNS_PER_PHASE: ${{ inputs.max_turns_per_phase }}
      HARD_INPUT_TOKENS: ${{ inputs.hard_input_tokens }}
      MAX_FILE_SIZE: ${{ inputs.max_file_size }}
      PHASE_VERIFY_COMMAND: ${{ inputs.verify_command }}
      BRANCH_NAME: ai/full-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate API key configuration
        run: test -n "$GEMINI_API_KEYS$GROQ_API_KEYS$OPENROUTER_API_KEYS" || { echo "At least one provider API key secret is required" >&2; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create accumulator branch
        run: |
          git config user.name "naelao-plan-bot"
          git config user.email "naelao-plan-bot@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"

      - name: Compile and verify self-contained prompts
        run: |
          node repomix/build-prompts.mjs
          node repomix/prepare-authority-context.mjs
          node repomix/verify-configs.mjs

      - name: Implement selected phases sequentially
        run: >-
          node run-phase.mjs
          --start "${{ inputs.start_phase }}"
          --end "${{ inputs.end_phase }}"
          --providers "${{ inputs.providers }}"
          --max-turns "${{ inputs.max_turns_per_phase }}"
          --hard-tokens "${{ inputs.hard_input_tokens }}"
          --max-file-size "${{ inputs.max_file_size }}"
          --verify "${{ inputs.verify_command }}"

      - name: Push accumulator branch
        run: git push --set-upstream origin "$BRANCH_NAME"

      - name: Upload model responses and patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .phase-runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH_NAME" \
            --title "Implement plan phases ${{ inputs.start_phase }}-${{ inputs.end_phase }}" \
            --body-file <(cat <<'EOF'
          Automated sequential implementation using the self-contained Repomix phase prompts.

          - Start phase: ${{ inputs.start_phase }}
          - End phase: ${{ inputs.end_phase }}
          - Providers: ${{ inputs.providers }}
          - Hard token ceiling: ${{ inputs.hard_input_tokens }}
          - Max file size budget: ${{ inputs.max_file_size }} bytes
          - Verification before every phase commit: `${{ inputs.verify_command }}`

          Each phase was regenerated from the preceding committed accumulator state. Review every
          commit, migration, deployment binding, security boundary, and release-ledger update before
          merging.
          EOF
          )
