name: Implement full plan with rotating AI models

on:
  workflow_dispatch:
    inputs:
      start_phase:
        description: First Repomix phase (1-13)
        required: true
        default: "1"
      end_phase:
        description: Last Repomix phase (1-13)
        required: true
        default: "13"
      models:
        description: Comma-separated Gemini model rotation
        required: true
        default: "gemini-2.5-flash,gemini-2.5-flash-lite"
      max_turns_per_phase:
        description: Maximum patch/continuation turns per phase
        required: true
        default: "8"

concurrency:
  group: implement-full-plan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BRANCH_NAME: ai/full-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate API key configuration
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: test -n "$GEMINI_API_KEYS" || { echo "Repository secret GEMINI_API_KEYS is required" >&2; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create accumulator branch
        run: |
          git config user.name "naelao-plan-bot"
          git config user.email "naelao-plan-bot@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"

      - name: Compile and verify self-contained prompts
        run: |
          node repomix/build-prompts.mjs
          node repomix/verify-configs.mjs

      - name: Implement selected phases sequentially
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PHASE_START: ${{ inputs.start_phase }}
          PHASE_END: ${{ inputs.end_phase }}
          AI_MODELS: ${{ inputs.models }}
          MAX_TURNS_PER_PHASE: ${{ inputs.max_turns_per_phase }}
        run: node run-phase.mjs

      - name: Push accumulator branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Upload model responses and patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .phase-runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE_START: ${{ inputs.start_phase }}
          PHASE_END: ${{ inputs.end_phase }}
          AI_MODELS: ${{ inputs.models }}
        run: |
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          printf '%s\n' \
            "Automated sequential implementation using the self-contained Repomix phase prompts." \
            "" \
            "- Start phase: ${PHASE_START}" \
            "- End phase: ${PHASE_END}" \
            "- Models: ${AI_MODELS}" \
            "- Verification before every phase commit: pnpm typecheck && pnpm test" \
            "" \
            "Each phase was regenerated from the preceding committed accumulator state. Review every" \
            "commit, migration, deployment binding, security boundary, and release-ledger update before" \
            "merging." > "$body_file"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH_NAME" \
            --title "Implement plan phases ${PHASE_START}-${PHASE_END}" \
            --body-file "$body_file"
