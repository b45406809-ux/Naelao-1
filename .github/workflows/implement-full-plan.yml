name: Implement verified plan slices

on:
  workflow_dispatch:
    inputs:
      start_slice:
        description: First dependency-ordered vertical slice (1-26)
        required: true
        default: "1"
      end_slice:
        description: Last vertical slice (1-26); lower this for a review-sized milestone
        required: true
        default: "26"
      implementation_models:
        description: Capability-ordered Gemini 3.x coding-model rotation
        required: true
        default: "gemini-3.1-pro-preview,gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.1-flash-lite"
      review_models:
        description: Capability-ordered Gemini 3.x independent-review rotation
        required: true
        default: "gemini-3.1-pro-preview,gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.1-flash-lite"
      max_turns_per_slice:
        description: Maximum context/implementation/repair turns per slice
        required: true
        default: "10"
      full_verify_command:
        description: Full verification at domain boundaries and final selected slice
        required: true
        default: "pnpm typecheck && pnpm test"

concurrency:
  group: implement-plan-accumulator
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_NAME: ai/verified-plan-accumulator

jobs:
  validate-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile specifications and repository index
        run: |
          node repomix/build-prompts.mjs
          node repomix/prepare-authority-context.mjs
          node repomix/build-repository-index.mjs
          node repomix/verify-configs.mjs
      - name: Runner contract tests
        run: >-
          pnpm exec vitest run --config tests/vitest.config.ts
          tests/unit/repomix/context-manifest.test.ts
          tests/unit/repomix/gemini-models.test.ts
          tests/unit/repomix/repository-index.test.ts
          tests/unit/requirements-trace-matrix.test.ts
      - name: Token-bounded dry run
        run: node run-phase.mjs --start 1 --end 26 --dry-run

  implement:
    needs: validate-runner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODELS: ${{ inputs.implementation_models }}
      REVIEW_MODELS: ${{ inputs.review_models }}
      MAX_TURNS_PER_PHASE: ${{ inputs.max_turns_per_slice }}
      PHASE_VERIFY_COMMAND: ${{ inputs.full_verify_command }}
      PHASE_PUSH_REMOTE: origin
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fail closed without Gemini keys
        run: test -n "$GEMINI_API_KEYS" || { echo "GEMINI_API_KEYS is required" >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Resume or create the accumulator branch
        run: |
          test -z "$(git status --porcelain)"
          git config user.name "naelao-plan-bot"
          git config user.email "naelao-plan-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME"
            git switch -C "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git switch -c "$BRANCH_NAME"
          fi
      - name: Compile verified inputs
        run: |
          node repomix/build-prompts.mjs
          node repomix/prepare-authority-context.mjs
          node repomix/verify-configs.mjs
      - name: Scout, implement, verify, and independently review selected slices
        run: >-
          node run-phase.mjs
          --start "${{ inputs.start_slice }}"
          --end "${{ inputs.end_slice }}"
          --models "${{ inputs.implementation_models }}"
          --review-models "${{ inputs.review_models }}"
          --max-turns "${{ inputs.max_turns_per_slice }}"
          --verify "${{ inputs.full_verify_command }}"
      - name: Push final accumulator state
        run: git push --set-upstream origin "$BRANCH_NAME"
      - name: Summarize phase evidence
        if: always()
        shell: bash
        run: |
          if [[ -d .phase-runs ]]; then
            find .phase-runs -type f -printf '%p\t%s bytes\n' | sort
          else
            echo "::warning::.phase-runs was not created; inspect the first failing implementation step above."
          fi
      - name: Upload manifests, notebooks, responses, patches, and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-plan-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .phase-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Open milestone pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "An open accumulator pull request already exists; leaving it in place."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH_NAME" \
              --title "Implement verified plan slices ${{ inputs.start_slice }}-${{ inputs.end_slice }}" \
              --body "Automated scout → dependency expansion → implementation → layered verification → independent review. Reruns resume this branch and skip slice completion commits already present."
          fi
