name: Bundle size check

on:
  pull_request:
    branches: [main]
    paths:
      - "workers/**"
      - "apps/widget/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  # Workers must stay under 8MB compressed (10MB CF limit, 8MB CI budget)
  WORKER_BUNDLE_LIMIT_KB: 8192
  # Widget must stay under 10KB gzipped
  WIDGET_LIMIT_KB: 10

jobs:
  bundle-check:
    name: Check bundle sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm --filter @naelao/widget build

      - name: Check widget bundle size (< 10KB gzipped)
        run: |
          WIDGET_GZ=$(gzip -c apps/widget/dist/naelao-chat.js | wc -c)
          WIDGET_KB=$(( (WIDGET_GZ + 1023) / 1024 ))
          echo "Widget gzipped size: ${WIDGET_KB}KB (limit: ${WIDGET_LIMIT_KB}KB)"
          if [ "$WIDGET_GZ" -gt "$(( WIDGET_LIMIT_KB * 1024 ))" ]; then
            echo "❌ Widget too large: ${WIDGET_KB}KB > ${WIDGET_LIMIT_KB}KB"
            exit 1
          fi
          echo "✅ Widget size OK"

      - name: Build workers (dry-run via wrangler)
        run: |
          FAILED=0
          for config in workers/*/wrangler.toml; do
            worker_dir="${config%/wrangler.toml}"
            worker=$(basename "$worker_dir")
            out_dir=$(mktemp -d)
            echo "Building $worker from $config..."
            if ! ./node_modules/.bin/wrangler deploy --dry-run --env=production \
              --outdir "$out_dir" --config "$config" >"$out_dir/build.log" 2>&1; then
              tail -30 "$out_dir/build.log"
              echo "  ❌ $worker build failed"
              FAILED=1
              continue
            fi
            if grep -q "Processing workers/.*wrangler.toml configuration:" "$out_dir/build.log"; then
              tail -30 "$out_dir/build.log"
              echo "  ❌ $worker has Wrangler configuration warnings"
              FAILED=1
              continue
            fi
            if [ ! -f "$out_dir/index.js" ]; then
              echo "  ❌ $worker build did not produce index.js"
              FAILED=1
              continue
            fi
            SIZE_GZ=$(gzip -c "$out_dir/index.js" | wc -c)
            SIZE_GZ_KB=$(( (SIZE_GZ + 1023) / 1024 ))
            echo "  $worker: ${SIZE_GZ_KB}KB gzipped"
            if [ "$SIZE_GZ" -gt "$(( WORKER_BUNDLE_LIMIT_KB * 1024 ))" ]; then
              echo "  ❌ $worker too large: ${SIZE_GZ_KB}KB > ${WORKER_BUNDLE_LIMIT_KB}KB"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "✅ All worker bundles within limits"
