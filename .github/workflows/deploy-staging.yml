name: Deploy to staging

permissions:
  contents: read

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  preflight:
    name: Staging preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Full typecheck
        run: pnpm --recursive --parallel typecheck

      - name: Run tests
        run: pnpm --filter "@naelao/tests" test

  deploy-workers-staging:
    name: Deploy workers to staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run D1 migrations (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DB_ID="${{ vars.D1_DATABASE_ID_STAGING }}"
          for migration in infra/migrations/*.sql; do
            echo "Applying $migration..."
            npx wrangler d1 execute "$DB_ID" \
              --file="$migration" \
              --remote \
              --env=staging 2>&1 || true
          done
          # Carrier-aware phone consumers require both discriminator columns.
          npx wrangler d1 execute "$DB_ID" --command="SELECT provider FROM assistant_phone_bindings LIMIT 0" --remote --env=staging
          npx wrangler d1 execute "$DB_ID" --command="SELECT provider FROM assistant_phone_quotes LIMIT 0" --remote --env=staging
          npx wrangler d1 execute "$DB_ID" --command="SELECT binding_id,event_id FROM assistant_telnyx_ingress_receipts LIMIT 0" --remote --env=staging
          npx wrangler d1 execute "$DB_ID" --command="SELECT receipt_hash FROM assistant_telnyx_usage_receipts LIMIT 0" --remote --env=staging
          npx wrangler d1 execute "$DB_ID" --command="SELECT action_id FROM assistant_telnyx_cost_polls LIMIT 0" --remote --env=staging
          # The sweeper depends on persisted fairness cursors. Make this newest idempotent
          # migration a required step instead of relying on the legacy best-effort loop above.
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0115_sweeper_fairness_cursors.sql \
            --remote \
            --env=staging
          # Refuse to deploy consumers that require the suspension-reason column if migration
          # application failed in the legacy best-effort loop above.
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT suspension_reason FROM spaces LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT suspension_reason FROM orgs LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT request_id FROM gdpr_erasure_outbox LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0119_portal_domains.sql \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT hostname FROM portal_domains LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0120_synthetics_storage.sql \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT check_name FROM synthetic_check_state LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0121_space_provisioning_leases.sql \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT lease_token FROM space_provisioning_leases LIMIT 0" \
            --remote \
            --env=staging
          # Platform assistant and builder-reset retention schemas are required by deployed routes.
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0122_platform_assistant_sessions.sql \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT session_id FROM assistant_messages LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT id FROM assistant_sessions LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0123_builder_reset_token_expiry_index.sql \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT rowid FROM builder_password_reset_tokens INDEXED BY idx_builder_password_reset_tokens_expiry WHERE julianday(expires_at) < julianday('now') LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0124_project_scoped_agent_email_addresses.sql \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT project_id FROM project_agent_email_addresses LIMIT 0" \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0128_space_workspace_cleanup_marker.sql \
            --remote \
            --env=staging
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT cleanup_completed_at FROM spaces LIMIT 0" \
            --remote \
            --env=staging

      - name: Deploy router worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --env=staging --config=workers/router/wrangler.toml

      - name: Deploy spaces worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --env=staging --config=workers/spaces/wrangler.toml

      - name: Deploy agents worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EMAIL_INGRESS_DOMAIN: ${{ vars.EMAIL_INGRESS_DOMAIN }}
        run: |
          if [ -n "$EMAIL_INGRESS_DOMAIN" ]; then
            npx wrangler deploy --var "EMAIL_INGRESS_DOMAIN:${EMAIL_INGRESS_DOMAIN}" --env=staging --config=workers/agents/wrangler.toml
          else
            npx wrangler deploy --env=staging --config=workers/agents/wrangler.toml
          fi

      - name: Deploy auth worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --env=staging --config=workers/auth/wrangler.toml

      - name: Deploy knowledge worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --env=staging --config=workers/knowledge/wrangler.toml

      - name: Deploy billing worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --env=staging --config=workers/billing/wrangler.toml

      - name: Deploy remaining workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # F-16: previously each failure was swallowed with `|| echo "non-fatal"`, so a
          # half-deployed platform still reported the job green. Now: track every failure, surface
          # a summary to the GitHub Actions run, and fail the step if ANY worker failed to deploy.
          failed=()
          for w in admin analytics artifact assistant browser connector-gumroad connector-whop credentials eval marketplace mcp-hub notifications portal-router provisioner security-gateway sweeper synthetics threads workflows ws-gateway; do
            if [ -f "workers/$w/wrangler.toml" ]; then
              echo "Deploying $w..."
              if ! npx wrangler deploy --env=staging --config="workers/$w/wrangler.toml"; then
                echo "❌ $w deploy failed"
                failed+=("$w")
              fi
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "### ❌ Staging deploy: ${#failed[@]} worker(s) failed: ${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Staging deploy: all secondary workers deployed" >> "$GITHUB_STEP_SUMMARY"

  deploy-dashboard-staging:
    name: Deploy dashboard to staging (CF Pages)
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging-pages
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm --filter @naelao/dashboard exec next-on-pages
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL_STAGING }}

      - name: Deploy to CF Pages (dashboard)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy apps/dashboard/.vercel/output/static \
            --project-name=naelao-dashboard-staging \
            --branch=main

  deploy-portal-staging:
    name: Deploy portal to staging (CF Pages)
    runs-on: ubuntu-latest
    environment: staging
    needs: [deploy-workers-staging]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portal
        run: pnpm --filter @naelao/portal exec next-on-pages
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL_STAGING }}

      - name: Deploy to CF Pages (portal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy apps/portal/.vercel/output/static \
            --project-name=naelao-portal-staging \
            --branch=main

  deploy-marketplace-staging:
    name: Deploy marketplace-web to staging (CF Pages)
    runs-on: ubuntu-latest
    environment: staging
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketplace
        run: pnpm --filter @naelao/marketplace-web exec next-on-pages
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL_STAGING }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.DASHBOARD_URL_STAGING }}

      - name: Deploy to CF Pages (marketplace)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy apps/marketplace-web/.vercel/output/static \
            --project-name=naelao-marketplace-staging \
            --branch=main

  deploy-widget-staging:
    name: Build and publish widget
    runs-on: ubuntu-latest
    environment: staging
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm --filter @naelao/widget build

      - name: Upload widget to R2 (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put \
            naelao-static/widget/naelao-chat.js \
            --file=apps/widget/dist/naelao-chat.js \
            --content-type="application/javascript" \
            --cache-control="public, max-age=300"
