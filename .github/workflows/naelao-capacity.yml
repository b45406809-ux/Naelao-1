name: Naelao local capacity probe
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths: ['.github/workflows/naelao-capacity.yml', 'workers/agents/src/index.ts', 'workers/agents/src/scheduled-job-constants.ts']
permissions:
  contents: read
jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [core, extended]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Baseline capacity
        run: |
          nproc
          free -m
          df -h .
          docker version
      - name: Install dependencies
        # Probe the current manifest on this disposable runner; report the separate frozen
        # lockfile failure without letting it prevent the capacity measurement.
        run: pnpm install --no-frozen-lockfile
      - name: Prepare local build dependencies
        run: |
          pnpm add --filter @naelao/shell --filter @naelao/dashboard --save-dev @types/node@22
          pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Start extended local stack and sample resources
        shell: bash
        env:
          PROBE_PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "$RUNNER_TEMP/naelao-probe"
          export PERSIST_DIR="$RUNNER_TEMP/naelao-probe/state"
          if [ "$PROBE_PROFILE" = core ]; then
            node infra/scripts/start-dev.mjs --workers-only > "$RUNNER_TEMP/naelao-probe/start.log" 2>&1 &
            ports='8080 8787 8788 8789 8791'
          else
            node infra/scripts/start-dev.mjs --extended > "$RUNNER_TEMP/naelao-probe/start.log" 2>&1 &
            ports='8080 8787 8788 8789 8791 3000 3100'
          fi
          stack_pid=$!
          echo "$stack_pid" > "$RUNNER_TEMP/naelao-probe/stack.pid"
          for i in $(seq 1 24); do
            printf '\nSample %s at %s\n' "$i" "$(date -u +%FT%TZ)"
            free -m
            df -h .
            ps -eo rss,comm --sort=-rss | head -20
            docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' || true
            for port in $ports; do
              printf '%s=' "$port"
              curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:$port/health" || true
              printf ' '
            done
            printf '\n'
            if ! kill -0 "$stack_pid" 2>/dev/null; then echo 'Stack exited early'; break; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/naelao-probe/start.log"
          if [ -f .dev/logs/agents.log ]; then
            printf '\nAgent startup diagnostics\n'
            rg -n -i -m 30 'error|fatal|panic|failed|out of memory|killed|deadlock' .dev/logs/agents.log || true
            head -100 .dev/logs/agents.log
          fi
          for log in .dev/logs/*.log; do printf '\n%s\n' "$log"; tail -30 "$log"; done
          docker system df
          ready=1
          for port in $ports; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "http://127.0.0.1:$port/health" || true)
            if [ "$code" = 000 ]; then ready=0; fi
          done
          if ! kill -0 "$stack_pid" 2>/dev/null; then ready=0; fi
          if [ "$ready" = 1 ]; then
            for kind in toolsandboxdo documentsandboxdo mediasandboxdo; do
              image=$(docker images --format '{{.Repository}}:{{.Tag}}' "cloudflare-dev/$kind" | head -1)
              if [ -z "$image" ]; then echo "Missing image: $kind"; ready=0; continue; fi
              case "$kind" in
                toolsandboxdo) check='node --version && python3 --version' ;;
                documentsandboxdo) check='soffice --version && pdftotext -v' ;;
                mediasandboxdo) check='ffmpeg -version | head -1' ;;
              esac
              echo "Starting $kind standalone container"
              if docker run -d --name "capacity-$kind" --entrypoint /bin/sh "$image" -c "$check; result=\$?; sleep 8; exit \$result"; then
                sleep 3
                docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' "capacity-$kind" || true
                status=$(timeout 90 docker wait "capacity-$kind" || echo timeout)
                docker logs "capacity-$kind" 2>&1 | head -12 || true
                docker rm -f "capacity-$kind" >/dev/null || true
                echo "$kind exit=$status"
                if [ "$status" != 0 ]; then ready=0; fi
                free -m
                df -h .
              else ready=0; fi
            done
          fi
          kill "$stack_pid" 2>/dev/null || true
          if [ "$ready" = 0 ]; then echo 'Core endpoints did not all become reachable'; exit 1; fi
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naelao-capacity-logs-${{ matrix.profile }}
          path: |
            .dev/logs/*.log
            ${{ runner.temp }}/naelao-probe/start.log
          retention-days: 2
          if-no-files-found: ignore
