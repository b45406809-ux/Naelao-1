name: Manual Command Runner

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Enter the command to run (e.g., npx repomix)'
        required: true
        type: string

jobs:
  run-command:
    runs-on: ubuntu-latest

    # Permission needed to push changes back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Custom Command
        env:
          USER_COMMAND: ${{ github.event.inputs.command }}
        run: |
          echo "Running: $USER_COMMAND"
          eval "$USER_COMMAND"

      - name: Commit and Push Changes
        run: |
          # Show modified/untracked files before staging (useful for debugging)
          echo "=== Git Status Before Staging ==="
          git status

          # Configure git with a generic GitHub Actions bot identity
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all changes (created, modified, or deleted files)
          git add -A

          # Only commit and push if there are actual changes to prevent workflow failure
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: automated changes from manual command [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes detected. Skipping commit and push."
          fi
