name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  # node:sqlite (used by tests/unit/helpers/sqlite-do-shim.ts + stubs/d1-sqlite.ts to run DO
  # SQLite tests against a real in-memory engine) is only a Node builtin from 22.5+ — Node 20
  # doesn't have it at all. Every test job was failing ERR_UNKNOWN_BUILTIN_MODULE under Node 20.
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages (e.g. @naelao/client-sdk, @naelao/billing-core) resolve via their
      # compiled dist/ (package.json main/types), which isn't committed. `pnpm --recursive`
      # bypasses turbo's `dependsOn: ["^build"]` graph entirely, so a clean checkout fails to
      # resolve any package that depends on another workspace package's build output.
      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Typecheck all packages
        # Do not spawn a TypeScript process for all 63 workspaces at once; that exceeds the
        # memory limit of smaller CI runners. Two concurrent projects retain useful parallelism.
        run: pnpm --recursive --workspace-concurrency=2 typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Run repository unit and integration tests
        run: pnpm exec vitest run --config tests/vitest.config.ts

      - name: Run package and worker test projects
        run: pnpm exec vitest run --workspace vitest.workspace.ts

      - name: Run native Node test projects
        run: node --test infra/scripts/*.test.mjs tests/unit/local-agent-client.node.test.mjs packages/bridge/test/*.test.mjs

      - name: Run conformance checks
        run: pnpm test:conformance

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --if-present must precede the script name or pnpm forwards it as a literal arg to the
      # underlying command (e.g. `next lint --if-present`, which next's CLI rejects).
      - name: Lint (if configured)
        run: pnpm --recursive --parallel --if-present lint
