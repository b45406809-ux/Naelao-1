name: Naelao batch measurements
on:
  push:
    branches: [work]
    paths: ['.github/workflows/naelao-batch-measure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        worker: [auth, notifications, artifact, knowledge, spaces, billing, credentials, ws-gateway, agents, router, browser, mcp-hub]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Runner capacity
        run: |
          nproc
          free -h
          df -h .
          docker info --format '{{.ServerVersion}}'
      - run: pnpm install --no-frozen-lockfile
      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2
      - name: Stage agent container dependencies
        if: matrix.worker == 'agents'
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { dirname, join, resolve } from 'node:path';
          import { cpSync, mkdirSync } from 'node:fs';
          const root = process.cwd();
          const require = createRequire(join(root, 'workers/agents/package.json'));
          const target = join(root, 'workers/agents/container/.vendor/node_modules');
          const platform = `@esbuild/${process.platform}-${process.arch}`;
          mkdirSync(join(target, '@esbuild'), { recursive: true });
          cpSync(dirname(require.resolve('esbuild/package.json')), join(target, 'esbuild'), { recursive: true, dereference: true });
          cpSync(resolve(root, 'node_modules/.pnpm/node_modules', platform), join(target, platform), { recursive: true, dereference: true });
          NODE
      - name: Start Worker and sample resources
        env:
          WORKER: ${{ matrix.worker }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/measure"
          export WRANGLER_SEND_METRICS=false
          started_ms=$(date +%s%3N)
          baseline_runtime_rss_kb=$(ps -eo rss=,comm= | awk '$2 == "node" || $2 == "workerd" || $2 == "MainThread" {sum += $1} END {print sum+0}')
          created_dev_vars=0
          if [ "$WORKER" = notifications ]; then
            printf 'RESEND_API_KEY=test-only-not-a-real-key\nWEBHOOK_SIGNING_SECRET=test-only-signing-secret\n' > workers/notifications/.dev.vars
            created_dev_vars=1
          fi
          pnpm exec wrangler dev --local --config "workers/$WORKER/wrangler.toml" --port 18800 --inspector-port 28800 --persist-to "$RUNNER_TEMP/measure/state" --var JWT_SECRET:local-test-secret --var PLATFORM_SECRET:local-test-secret --var CREDENTIAL_ENCRYPTION_KEY:v1:$(printf '00%.0s' {1..32}) > "$RUNNER_TEMP/measure/worker.log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            if [ "$created_dev_vars" = 1 ]; then rm -f workers/notifications/.dev.vars; fi
          }
          trap cleanup EXIT
          ready=0
          http_status=000
          steady_probes_ok=0
          disk_total_bytes=$(df -B1 --output=size . | tail -1 | tr -d ' ')
          startup_ms=0
          sample_count=0
          sample_resources() {
            sample_count=$((sample_count + 1))
            elapsed_ms=$(( $(date +%s%3N) - started_ms ))
            used_kb=$(awk '/^MemTotal:/ {total=$2} /^MemAvailable:/ {available=$2} END {print total-available}' /proc/meminfo)
            total_runtime_rss_kb=$(ps -eo rss=,comm= | awk '$2 == "node" || $2 == "workerd" || $2 == "MainThread" {sum += $1} END {print sum+0}')
            rss_kb=$(( total_runtime_rss_kb > baseline_runtime_rss_kb ? total_runtime_rss_kb - baseline_runtime_rss_kb : 0 ))
            disk_used_bytes=$(df -B1 --output=used . | tail -1 | tr -d ' ')
            printf '%s %s %s %s\n' "$elapsed_ms" "$used_kb" "$rss_kb" "$disk_used_bytes" >> "$RUNNER_TEMP/measure/resources.tsv"
            echo "sample=$sample_count elapsed_ms=$elapsed_ms system_used_kb=$used_kb node_workerd_rss_kb=$rss_kb disk_used_bytes=$disk_used_bytes"
          }
          for i in $(seq 1 240); do
            http_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 1 http://127.0.0.1:18800/health || true)
            if [ "$http_status" != 000 ]; then
              ready=1
              startup_ms=$(( $(date +%s%3N) - started_ms ))
              break
            fi
            if [ "$((i % 4))" = 0 ]; then sample_resources; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          # Hold the worker for ten more seconds to measure idle memory after startup and verify
          # that the local server remains responsive. These are runner-local requests only.
          if [ "$ready" = 1 ]; then
            for i in $(seq 1 10); do
              response=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 2 http://127.0.0.1:18800/health || true)
              probe_status=${response%% *}
              probe_seconds=${response#* }
              probe_latency_ms=$(awk -v seconds="$probe_seconds" 'BEGIN {printf "%.3f", seconds * 1000}')
              echo "$probe_latency_ms" >> "$RUNNER_TEMP/measure/probe-latencies-ms.txt"
              case "$probe_status" in 2*|3*|4*) steady_probes_ok=$((steady_probes_ok + 1)) ;; esac
              http_status=$probe_status
              sample_resources
              sleep 1
            done
            [ "$steady_probes_ok" = 10 ] || ready=0
          fi
          kill "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/measure/worker.log"
          finished_ms=$(date +%s%3N)
          env WORKER="$WORKER" CI_CPUS="$(nproc)" CI_MEMORY_KB="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)" \
            STARTUP_MS="$startup_ms" ELAPSED_MS="$((finished_ms - started_ms))" \
            SAMPLE_COUNT="$sample_count" DISK_TOTAL_BYTES="$disk_total_bytes" \
            HTTP_STATUS="$http_status" READY="$ready" STEADY_PROBES_OK="$steady_probes_ok" \
            SAMPLES_FILE="$RUNNER_TEMP/measure/resources.tsv" LATENCIES_FILE="$RUNNER_TEMP/measure/probe-latencies-ms.txt" \
            METRICS_FILE="$RUNNER_TEMP/measure/metrics.json" \
            node -e 'const fs=require("node:fs");const values=(p)=>fs.existsSync(p)?fs.readFileSync(p,"utf8").trim().split(/\s+/).filter(Boolean).map(Number):[];const resources=values(process.env.SAMPLES_FILE);const triples=[];for(let i=0;i+3<resources.length;i+=4)triples.push(resources.slice(i,i+4));const percentile=(a,p)=>a.length?a[Math.min(a.length-1,Math.ceil(p*a.length)-1)]:null;const latencies=values(process.env.LATENCIES_FILE).sort((a,b)=>a-b);const max=(i)=>triples.length?Math.max(...triples.map(x=>x[i])):0;const status=Number(process.env.HTTP_STATUS);const m={worker:process.env.WORKER,runner:{cpus:Number(process.env.CI_CPUS),memory_total_kb:Number(process.env.CI_MEMORY_KB),disk_total_bytes:Number(process.env.DISK_TOTAL_BYTES)},startup_ms:Number(process.env.STARTUP_MS),elapsed_ms:Number(process.env.ELAPSED_MS),resource_samples:triples.length,peak_system_used_kb:max(1),peak_node_workerd_rss_kb:max(2),peak_disk_used_bytes:max(3),probe_latency_ms:{p50:percentile(latencies,.50),p95:percentile(latencies,.95),max:latencies.at(-1)??null},responding:process.env.READY==="1",steady_probe_successes:Number(process.env.STEADY_PROBES_OK),http_status:process.env.HTTP_STATUS,health_endpoint_ok:status===200};fs.writeFileSync(process.env.METRICS_FILE,JSON.stringify(m,null,2)+"\n");console.log(JSON.stringify(m));'
          test "$ready" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-measure-${{ matrix.worker }}
          path: ${{ runner.temp }}/measure/*
          if-no-files-found: ignore
  report:
    if: always()
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: batch-measure-*
          path: measurements
      - name: Summarize isolated worker capacity
        env:
          MATRIX_RESULT: ${{ needs.worker.result }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = ['agents','artifact','auth','billing','browser','credentials','knowledge','mcp-hub','notifications','router','spaces','ws-gateway'];
          const rows = expected.map(worker => {
            try {
              return JSON.parse(fs.readFileSync(path.join('measurements', `batch-measure-${worker}`, 'metrics.json'), 'utf8'));
            } catch {
              return { worker, responding: false, missing: true };
            }
          });
          const mb = value => Number.isFinite(value) ? (value / 1024).toFixed(0) : '—';
          const gb = value => Number.isFinite(value) ? (value / 1e9).toFixed(1) : '—';
          const table = [
            '| Worker | Startup ms | Probe p95 ms | Added RSS MB | Peak RAM used MB | Disk used / total GB | HTTP |',
            '|---|---:|---:|---:|---:|---:|---:|',
            ...rows.map(row => `| ${row.worker} | ${row.startup_ms ?? '—'} | ${row.probe_latency_ms?.p95 ?? '—'} | ${mb(row.peak_node_workerd_rss_kb)} | ${mb(row.peak_system_used_kb)} | ${gb(row.peak_disk_used_bytes)} / ${gb(row.runner?.disk_total_bytes)} | ${row.http_status ?? 'missing'} |`),
          ].join('\n');
          const summary = `## Isolated worker capacity\n\nRunner: 4 vCPU and approximately 16 GB RAM per job. Each worker was measured on its own runner; matrix parallelism was capped at 3. The separate core and extended workflows measure shared-stack pressure.\n\n${table}\n\nThe probe requests /health. HTTP 404/401 means the worker responded but has no public health route or requires authorization; HTTP 500 is treated as a failed probe. Ten steady probes are required after startup. A 200 response is marked as a health endpoint success.\n\nMatrix result: **${process.env.MATRIX_RESULT}**.\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          if (process.env.MATRIX_RESULT !== 'success' || rows.some(row => row.missing || !row.responding || row.steady_probe_successes !== 10 || Number(row.http_status) >= 500)) process.exitCode = 1;
          NODE
