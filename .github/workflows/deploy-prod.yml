name: Deploy to production

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  # node:sqlite is a Node builtin only from 22.5+ (see ci.yml's own note) — required by the
  # DO SQLite test helpers.
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  preflight:
    name: Production preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test environment isolation guard
        run: python3 -m unittest discover -s infra/scripts -p "test_validate_wrangler_env_isolation.py"

      - name: Test environment resource inventory and receipts
        run: python3 -m unittest discover -s infra/scripts -p "test_validate_environment_resources.py"

      - name: Test GET-only Cloudflare resource receipt collector
        run: python3 -m unittest discover -s infra/scripts -p "test_collect_cloudflare_resource_receipts.py"

      - name: Test durable D1 release migration runner
        run: python3 -m unittest discover -s infra/scripts -p "test_release_migrations.py"

      - name: Test release schema manifest
        run: python3 -m unittest discover -s infra/scripts -p "test_validate_release_manifest.py"

      - name: Test deployment release manifest
        run: python3 -m unittest discover -s infra/scripts -p "test_validate_deployment_manifest.py"

      - name: Test durable queue health schema
        run: python3 -m unittest discover -s infra/scripts -p "test_queue_health_migration.py"

      - name: Validate deployment release manifest
        run: python3 infra/scripts/validate_deployment_manifest.py

      - name: Validate release schema manifest
        run: python3 infra/scripts/validate_release_manifest.py

      - name: Require isolated environment resources and staging inventory receipts
        run: python3 infra/scripts/validate_environment_resources.py

      - name: Reject shared mutable staging/production bindings
        run: python3 infra/scripts/validate_wrangler_env_isolation.py

      - name: Validate Wrangler-resolved environment binding inventory
        run: node infra/scripts/validate_rendered_environment_resources.mjs

      - name: Test Wrangler-resolved environment binding inventory
        run: node --test infra/scripts/test_validate_rendered_environment_resources.mjs

      # `pnpm --recursive` bypasses turbo's build-dependency graph (see ci.yml) — build first.
      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Full typecheck
        run: pnpm --recursive --parallel typecheck

      - name: Run tests
        run: pnpm --filter "@naelao/tests" test

  deploy-workers-prod:
    name: Deploy workers to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DB_ID="${{ vars.D1_DATABASE_ID_PROD }}"
          : "${DB_ID:?D1_DATABASE_ID_PROD is required}"
          # The runner requires a reviewed per-database baseline before it contacts D1.
          # It journals each migration checksum atomically and retains its lock after failure.
          python3 infra/scripts/release_migrations.py \
            --environment production \
            --database-id "$DB_ID" \
            --execution-id "${D1_MIGRATION_RESUME_OWNER:-${GITHUB_WORKFLOW}-${GITHUB_RUN_ID}}" \
            --baseline infra/release/baselines/production.json \
            --wrangler npx wrangler
          # Keep the deploy-time consumer probes; any missing column/table stops this job.
          npx wrangler d1 execute "$DB_ID" --command="SELECT provider FROM assistant_phone_bindings LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT provider FROM assistant_phone_quotes LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT binding_id,event_id FROM assistant_telnyx_ingress_receipts LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT receipt_hash FROM assistant_telnyx_usage_receipts LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT action_id FROM assistant_telnyx_cost_polls LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT status,model_id,price_snapshot FROM decision_call_reservations LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT suspension_reason FROM spaces LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT suspension_reason FROM orgs LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT request_id FROM gdpr_erasure_outbox LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT hostname FROM portal_domains LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT check_name FROM synthetic_check_state LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT lease_token FROM space_provisioning_leases LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT session_id FROM assistant_messages LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT id FROM assistant_sessions LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT rowid FROM builder_password_reset_tokens INDEXED BY idx_builder_password_reset_tokens_expiry WHERE julianday(expires_at) < julianday('now') LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT project_id FROM project_agent_email_addresses LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT cleanup_completed_at FROM spaces LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT key_hash FROM agentport_api_keys LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT email_normalized FROM agentport_developers LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT provider_channel_id,session_binding_json,receipt_hash FROM agentport_channels LEFT JOIN agentport_threads ON 1=0 LEFT JOIN agentport_action_receipts ON 1=0 LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT public_jwk_json,private_key_ciphertext FROM agentport_identity_keys LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT jti,expires_at,revoked_at FROM agentport_issued_credentials LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT auth_json FROM agentport_provider_auth LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT provider_message_id FROM agentport_channel_message_refs LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT token_hash FROM agentport_oauth_tokens LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT billing_json FROM agentport_services LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT monthly_budget_micros FROM agentport_apps LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT triggered_at,observed_at,source,status,unavailable_reason,metrics_json,alert_count,alerts_json FROM queue_health_checks LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT id,sender_principal_id FROM agentport_channel_message_refs LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT email_alerts_enabled,email_recipient_kind FROM managed_service_cost_budgets LIMIT 0" --remote
          npx wrangler d1 execute "$DB_ID" --command="SELECT id,alert_id,tenant_id,space_id,project_id,user_id,recipient_kind,status,attempts,next_at,lease_token,lease_until,last_error,created_at,updated_at,accepted_at FROM managed_service_cost_budget_email_deliveries LIMIT 0" --remote

      - name: Deploy all workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EMAIL_INGRESS_DOMAIN: ${{ vars.EMAIL_INGRESS_DOMAIN }}
        run: |
          # F-16: a bash `for` loop's exit code is the LAST iteration's, so a mid-loop deploy
          # failure was silently masked by a later success — production could half-deploy and still
          # report green. Track every failure and fail the step (with a run summary) if any occurred.
          WORKERS=(admin agentport agents analytics artifact assistant auth billing browser \
                   connector-gumroad connector-whop credentials eval knowledge marketplace \
                   mcp-hub notifications portal-router provisioner router sandboxes \
                   security-gateway spaces sweeper synthetics threads workflows ws-gateway)
          failed=()
          for w in "${WORKERS[@]}"; do
            if [ -f "workers/$w/wrangler.toml" ]; then
              echo "Deploying $w to production..."
              # F-13: MUST pass --env=production, or wrangler deploys the top-level config
              # (ENVIRONMENT="development", localhost CORS) to production. Every worker defines an
              # [env.production] block (parity enforced by wrangler-vars-parity.test.ts).
              if [ "$w" = "agents" ]; then
                deploy_args=()
                if [ -n "$EMAIL_INGRESS_DOMAIN" ]; then
                  deploy_args=(--var "EMAIL_INGRESS_DOMAIN:${EMAIL_INGRESS_DOMAIN}")
                fi
              else
                deploy_args=()
              fi
              if ! npx wrangler deploy "${deploy_args[@]}" --env=production --config="workers/$w/wrangler.toml"; then
                echo "❌ $w deploy failed"
                failed+=("$w")
              fi
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "### ❌ Production deploy: ${#failed[@]} worker(s) failed: ${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Production deploy: all workers deployed" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe deployed production Workers before frontend publication
        env:
          API_BASE_URL: ${{ vars.API_URL_PROD }}
        run: python3 infra/scripts/probe_deployment_health.py --environment production

  deploy-frontends-prod:
    name: Deploy frontends to production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    needs: [deploy-workers-prod]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all frontends
        run: |
          pnpm --filter @naelao/dashboard exec next-on-pages
          pnpm --filter @naelao/portal exec next-on-pages
          pnpm --filter @naelao/marketplace-web exec next-on-pages
          pnpm --filter @naelao/widget build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL_PROD }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.DASHBOARD_URL_PROD }}
          NEXT_PUBLIC_PRODUCT_SHELL_URL: https://app.naelao.com

      - name: Deploy to CF Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy apps/dashboard/.vercel/output/static \
            --project-name=naelao-dashboard --branch=main
          npx wrangler pages deploy apps/portal/.vercel/output/static \
            --project-name=naelao-portal --branch=main
          npx wrangler pages deploy apps/marketplace-web/.vercel/output/static \
            --project-name=naelao-marketplace --branch=main

      - name: Upload widget to R2 (production, versioned + latest)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TAG="${{ github.ref_name }}"
          npx wrangler r2 object put \
            naelao-static/widget/${TAG}/naelao-chat.js \
            --file=apps/widget/dist/naelao-chat.js \
            --content-type="application/javascript" \
            --cache-control="public, max-age=31536000, immutable"
          npx wrangler r2 object put \
            naelao-static/widget/latest/naelao-chat.js \
            --file=apps/widget/dist/naelao-chat.js \
            --content-type="application/javascript" \
            --cache-control="public, max-age=3600"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/widget/dist/naelao-chat.js
