name: Deploy to production

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  # node:sqlite is a Node builtin only from 22.5+ (see ci.yml's own note) — required by the
  # DO SQLite test helpers.
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  preflight:
    name: Production preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm --recursive` bypasses turbo's build-dependency graph (see ci.yml) — build first.
      - name: Build workspace packages
        run: pnpm turbo run build

      - name: Full typecheck
        run: pnpm --recursive --parallel typecheck

      - name: Run tests
        run: pnpm --filter "@naelao/tests" test

  deploy-workers-prod:
    name: Deploy workers to production
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DB_ID="${{ vars.D1_DATABASE_ID_PROD }}"
          for migration in infra/migrations/*.sql; do
            echo "Applying $migration..."
            npx wrangler d1 execute "$DB_ID" \
              --file="$migration" \
              --remote 2>&1 || true
          done
          # The sweeper depends on persisted fairness cursors. Make this newest idempotent
          # migration a required step instead of relying on the legacy best-effort loop above.
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0115_sweeper_fairness_cursors.sql \
            --remote
          # Refuse to deploy consumers that require the suspension-reason column if migration
          # application failed in the legacy best-effort loop above.
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT suspension_reason FROM spaces LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT suspension_reason FROM orgs LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT request_id FROM gdpr_erasure_outbox LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0119_portal_domains.sql \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT hostname FROM portal_domains LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0120_synthetics_storage.sql \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT check_name FROM synthetic_check_state LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0121_space_provisioning_leases.sql \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT lease_token FROM space_provisioning_leases LIMIT 0" \
            --remote
          # Platform assistant and builder-reset retention schemas are required by deployed routes.
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0122_platform_assistant_sessions.sql \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT session_id FROM assistant_messages LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT id FROM assistant_sessions LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0123_builder_reset_token_expiry_index.sql \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT rowid FROM builder_password_reset_tokens INDEXED BY idx_builder_password_reset_tokens_expiry WHERE julianday(expires_at) < julianday('now') LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0124_project_scoped_agent_email_addresses.sql \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT project_id FROM project_agent_email_addresses LIMIT 0" \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --file=infra/migrations/0128_space_workspace_cleanup_marker.sql \
            --remote
          npx wrangler d1 execute "$DB_ID" \
            --command="SELECT cleanup_completed_at FROM spaces LIMIT 0" \
            --remote

      - name: Deploy all workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EMAIL_INGRESS_DOMAIN: ${{ vars.EMAIL_INGRESS_DOMAIN }}
        run: |
          # F-16: a bash `for` loop's exit code is the LAST iteration's, so a mid-loop deploy
          # failure was silently masked by a later success — production could half-deploy and still
          # report green. Track every failure and fail the step (with a run summary) if any occurred.
          WORKERS=(admin agents analytics artifact assistant auth billing browser \
                   connector-gumroad connector-whop credentials eval knowledge marketplace \
                   mcp-hub notifications portal-router provisioner router \
                   security-gateway spaces sweeper synthetics threads workflows ws-gateway)
          failed=()
          for w in "${WORKERS[@]}"; do
            if [ -f "workers/$w/wrangler.toml" ]; then
              echo "Deploying $w to production..."
              # F-13: MUST pass --env=production, or wrangler deploys the top-level config
              # (ENVIRONMENT="development", localhost CORS) to production. Every worker defines an
              # [env.production] block (parity enforced by wrangler-vars-parity.test.ts).
              if [ "$w" = "agents" ]; then
                deploy_args=()
                if [ -n "$EMAIL_INGRESS_DOMAIN" ]; then
                  deploy_args=(--var "EMAIL_INGRESS_DOMAIN:${EMAIL_INGRESS_DOMAIN}")
                fi
              else
                deploy_args=()
              fi
              if ! npx wrangler deploy "${deploy_args[@]}" --env=production --config="workers/$w/wrangler.toml"; then
                echo "❌ $w deploy failed"
                failed+=("$w")
              fi
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "### ❌ Production deploy: ${#failed[@]} worker(s) failed: ${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Production deploy: all workers deployed" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontends-prod:
    name: Deploy frontends to production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    needs: [deploy-workers-prod]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all frontends
        run: |
          pnpm --filter @naelao/dashboard exec next-on-pages
          pnpm --filter @naelao/portal exec next-on-pages
          pnpm --filter @naelao/marketplace-web exec next-on-pages
          pnpm --filter @naelao/widget build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL_PROD }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.DASHBOARD_URL_PROD }}

      - name: Deploy to CF Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy apps/dashboard/.vercel/output/static \
            --project-name=naelao-dashboard --branch=main
          npx wrangler pages deploy apps/portal/.vercel/output/static \
            --project-name=naelao-portal --branch=main
          npx wrangler pages deploy apps/marketplace-web/.vercel/output/static \
            --project-name=naelao-marketplace --branch=main

      - name: Upload widget to R2 (production, versioned + latest)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TAG="${{ github.ref_name }}"
          npx wrangler r2 object put \
            naelao-static/widget/${TAG}/naelao-chat.js \
            --file=apps/widget/dist/naelao-chat.js \
            --content-type="application/javascript" \
            --cache-control="public, max-age=31536000, immutable"
          npx wrangler r2 object put \
            naelao-static/widget/latest/naelao-chat.js \
            --file=apps/widget/dist/naelao-chat.js \
            --content-type="application/javascript" \
            --cache-control="public, max-age=3600"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/widget/dist/naelao-chat.js
