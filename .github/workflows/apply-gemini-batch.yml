name: Apply Gemini batch patch

on:
  push:
    paths:
      - "repomix/patches/batch-*.patch"
  workflow_dispatch:
    inputs:
      patch_path:
        description: Tracked patch to apply (for example repomix/patches/batch-01.patch)
        required: true
        type: string

concurrency:
  group: apply-gemini-batch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out accumulator branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select exactly one batch patch
        id: patch
        env:
          DISPATCH_PATCH: ${{ inputs.patch_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            patches="$DISPATCH_PATCH"
          else
            patches="$(git diff-tree --no-commit-id --name-only -r HEAD -- 'repomix/patches/batch-*.patch')"
          fi
          count="$(printf '%s\n' "$patches" | sed '/^$/d' | wc -l)"
          test "$count" -eq 1 || { echo "Expected exactly one changed batch patch, found $count" >&2; exit 1; }
          patch="$(printf '%s\n' "$patches" | sed '/^$/d')"
          [[ "$patch" =~ ^repomix/patches/batch-[0-9]{2}\.patch$ ]] || { echo "Invalid patch path: $patch" >&2; exit 1; }
          test -f "$patch"
          echo "path=$patch" >> "$GITHUB_OUTPUT"

      - name: Apply patch and generate next hand-off
        run: node repomix/apply-batch-patch.mjs "${{ steps.patch.outputs.path }}"

      - name: Read hand-off metadata
        id: handoff
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const handoff = require("./.repomix-cache/batch-handoff.json");
          for (const [key, value] of Object.entries(handoff)) console.log(`${key}=${value}`);
          NODE

      - name: Commit applied code and regenerated prompts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Patch produced no changes" >&2; exit 1; }
          git commit -m "Implement Gemini batch ${{ steps.handoff.outputs.appliedBatch }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload next Repomix XML and prompt
        uses: actions/upload-artifact@v4
        with:
          name: repomix-batch-${{ steps.handoff.outputs.outputBatch }}-${{ github.run_id }}
          path: |
            ${{ steps.handoff.outputs.outputPath }}
            ${{ steps.handoff.outputs.promptPath }}
          if-no-files-found: error
          retention-days: 14
