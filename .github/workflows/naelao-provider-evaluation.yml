name: Naelao opt-in live model evaluation

on:
  push:
    tags:
      - 'provider-eval-*'

permissions:
  contents: read

jobs:
  free-tier-model-evaluation:
    name: Bounded Gemini and GroqCloud evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Mask provider keys and record secret presence only
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const parse = (value = '') => [...new Set(value.split(',').map(item => item.trim()).filter(Boolean))];
          const gemini = parse(process.env.GEMINI_API_KEYS || process.env.GEMINI_API_KEY);
          const groq = parse(process.env.GROQ_API_KEYS || process.env.GROQ_API_KEY);
          for (const key of [...gemini, ...groq]) process.stdout.write(`::add-mask::${key}\n`);
          fs.writeFileSync('provider-presence.json', JSON.stringify({ geminiSlots: gemini.length, groqcloudSlots: groq.length, keyValuesLogged: false }) + '\n');
          JS
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace test dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify live-provider follow-up gates
        run: node --test infra/scripts/provider-followup-gate.test.mjs
      - name: Run bounded synthetic provider comparison
        if: ${{ !startsWith(github.ref_name, 'provider-eval-blackboard-only-') }}
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_GEMINI_FREE_EVAL: 'true'
          RUN_GROQ_FREE_EVAL: 'true'
          GEMINI_FREE_TIER_CONFIRMED: 'true'
          GROQ_FREE_TIER_CONFIRMED: 'true'
          GROQ_FREE_MODEL_ID: openai/gpt-oss-20b
          SWARM_PROVIDER_REPORT: provider-eval.json
        run: node infra/scripts/swarm-provider-eval.mjs
      - name: Disable follow-up calls for quota-limited providers
        if: ${{ always() && !startsWith(github.ref_name, 'provider-eval-blackboard-only-') }}
        env:
          PROVIDER_SMOKE_REPORT: provider-eval.json
        run: |
          node infra/scripts/provider-followup-gate.mjs ranking
      - name: Admit an explicitly tagged blackboard-only evaluation
        if: ${{ startsWith(github.ref_name, 'provider-eval-blackboard-only-') }}
        env:
          GEMINI_FREE_TIER_CONFIRMED: 'true'
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_FREE_TIER_CONFIRMED: 'true'
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_MODEL_ID: openai/gpt-oss-20b
        run: node infra/scripts/provider-followup-gate.mjs blackboard-only
      - name: Run bounded model ranking through production blackboard reranker
        if: always()
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: 'true'
          GROQ_FREE_TIER_CONFIRMED: 'true'
          GROQ_FREE_MODEL_ID: openai/gpt-oss-20b
          NAELAO_RUN_LIVE_BLACKBOARD_RANKING: 'true'
          NAELAO_LIVE_BLACKBOARD_REPORT: ${{ github.workspace }}/blackboard-ranking-live.json
        run: pnpm --filter @naelao/agents-worker exec vitest run src/communications/blackboard-ranking-provider-evaluation.test.ts --reporter=verbose
      - name: Disable planning calls after a ranking failure or provider rate limit
        if: always()
        env:
          BLACKBOARD_RANKING_REPORT: blackboard-ranking-live.json
        run: node infra/scripts/provider-followup-gate.mjs planning
      - name: Run real-model planning through the goal DAG and host verifier
        if: ${{ always() && !startsWith(github.ref_name, 'provider-eval-blackboard-only-') }}
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: 'true'
          GROQ_FREE_TIER_CONFIRMED: 'true'
          GROQ_FREE_MODEL_ID: openai/gpt-oss-20b
          NAELAO_RUN_LIVE_ARCH_BENCHMARK: 'true'
          NAELAO_LIVE_ARCH_REPORT: live-goal-plan-benchmark.json
          NAELAO_GOAL_BENCHMARK_REPORT: goal-architecture-benchmark.json
        run: pnpm --filter @naelao/agents-worker exec vitest run src/script-engine/goal-architecture-benchmark.test.ts --reporter=verbose
      - name: Publish measured metrics
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let report;
          try { report = JSON.parse(fs.readFileSync('provider-eval.json', 'utf8')); }
          catch { report = null; }
          const lines = ['## Naelao live model evaluation', '', `Commit: \`${process.env.GITHUB_SHA}\``, `Tag: \`${process.env.GITHUB_REF_NAME}\``, ''];
          if (!report) lines.push(process.env.GITHUB_REF_NAME.startsWith('provider-eval-blackboard-only-') ? 'Provider smoke stage skipped for the blackboard-only test profile.' : 'Evaluation report was not produced.');
          else {
            lines.push('| Provider / model | State | Quality outcome | Inference calls | Valid response | Valid accuracy | Strict accuracy | False accepts | p50 / p95 ms | Est. paid $ / 1k cases |', '|---|---:|---|---:|---:|---:|---:|---:|---:|---:|');
            for (const result of report.results) {
              lines.push(`| ${result.provider} / ${result.model ?? 'unconfigured'} | ${result.state} | ${result.qualityOutcome} | ${result.inferenceRequests} | ${fmt(result.validResponseRate)} | ${fmt(result.accuracy)} | ${fmt(result.strictAccuracy)} | ${result.falseAcceptanceCount} | ${result.latencyP50Ms ?? '—'} / ${result.latencyP95Ms ?? '—'} | ${result.nominalPaidCost?.estimatedUsdPer1000Cases ?? '—'} |`);
              lines.push('', `**${result.provider} case outcomes**`, '', '| Case | Expected | Decision | State | Failure / HTTP | Latency ms | Tokens in/out |', '|---|---|---|---|---|---:|---:|');
              for (const item of result.cases) lines.push(`| ${item.id} | ${item.expected ?? '—'} | ${item.decision ?? '—'} | ${item.state} | ${item.failure ?? '—'}${item.httpStatus ? ` / ${item.httpStatus}` : ''} | ${item.latencyMs ?? '—'} | ${item.inputTokens ?? '—'} / ${item.outputTokens ?? '—'} |`);
            }
            lines.push('', `Dataset: ${report.caseCount} synthetic cases. Model discovery requests are reported separately from inference. Price figures are paid-rate estimates from ${report.pricingSnapshotDate}; confirmed free-tier usage is not charged at these rates. Results are advisory and are not production acceptance.`);
          }
          function fmt(value) { return value == null ? '—' : `${(value * 100).toFixed(1)}%`; }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          JS
      - name: Publish model-planning metrics
        if: always()
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          let report; try { report = JSON.parse(fs.readFileSync('live-goal-plan-benchmark.json', 'utf8')); } catch {}
          console.log('\n## Live model planning through Naelao goal runtime\n');
          if (!report) console.log(process.env.GITHUB_REF_NAME.startsWith('provider-eval-blackboard-only-') ? 'Planning stage skipped for the blackboard-only test profile.' : 'No live planning report was produced.');
          else {
            console.log('| Provider/model | Calls | Valid plans | Valid DAGs | Host-verified fixtures | Plan p50/p95 ms | Mock execution p50/p95 ms | Tokens in/out |\n|---|---:|---:|---:|---:|---:|---:|---:|');
            for (const item of report.results) console.log(`| ${item.provider}/${item.model} | ${item.requests ?? 0} | ${item.validPlans ?? 0} | ${item.validGraphs ?? 0} | ${item.verifiedFixtureRuns ?? 0} | ${item.planLatencyP50Ms ?? '—'}/${item.planLatencyP95Ms ?? '—'} | ${item.fixtureExecutionLatencyP50Ms ?? '—'}/${item.fixtureExecutionLatencyP95Ms ?? '—'} | ${item.inputTokens ?? '—'}/${item.outputTokens ?? '—'} |`);
            console.log('\n' + report.limitations.map(item => `- ${item}`).join('\n'));
          }
          JS
      - name: Publish blackboard ranking metrics
        if: always()
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          let report; try { report = JSON.parse(fs.readFileSync('blackboard-ranking-live.json', 'utf8')); } catch {}
          console.log('\n## Test-only blackboard model ranking\n');
          if (!report) console.log('No live ranking report was produced.');
          else for (const result of report.providers) {
            console.log(`- **${result.provider}/${result.model ?? 'unconfigured'}:** ${result.state}${result.reason ? ` (${result.reason})` : ''}; calls ${result.inferenceRequests ?? 'unknown'}; request latency p50/p95 ${result.requestLatencyP50Ms ?? '—'}/${result.requestLatencyP95Ms ?? '—'} ms; tokens ${result.inputTokens ?? '—'}/${result.outputTokens ?? '—'}; provider-reported cost ${result.providerReportedCostUsd ?? 'unavailable'}.`);
            if (result.baseline && result.modelCandidate) console.log(`  - On ${result.queries} queries: MRR ${result.baseline.meanReciprocalRank.toFixed(3)} → ${result.modelCandidate.meanReciprocalRank.toFixed(3)} (Δ ${result.pairedDelta.meanReciprocalRank.toFixed(3)}); Recall@5 ${result.baseline.meanRecallAtK.toFixed(3)} → ${result.modelCandidate.meanRecallAtK.toFixed(3)} (Δ ${result.pairedDelta.meanRecallAtK.toFixed(3)}); nDCG@5 ${result.baseline.meanNdcgAtK.toFixed(3)} → ${result.modelCandidate.meanNdcgAtK.toFixed(3)} (Δ ${result.pairedDelta.meanNdcgAtK.toFixed(3)}).`);
            if (result.expandedCandidatePool) console.log(`  - All-visible pool ablation, same query/cards: MRR ${result.expandedCandidatePool.baseline.meanReciprocalRank.toFixed(3)} → ${result.expandedCandidatePool.modelCandidate.meanReciprocalRank.toFixed(3)}; Recall@5 ${result.expandedCandidatePool.baseline.meanRecallAtK.toFixed(3)} → ${result.expandedCandidatePool.modelCandidate.meanRecallAtK.toFixed(3)}; nDCG@5 ${result.expandedCandidatePool.baseline.meanNdcgAtK.toFixed(3)} → ${result.expandedCandidatePool.modelCandidate.meanNdcgAtK.toFixed(3)}.`);
            if (result.queryWordingHoldout) console.log(`  - Separate query-wording holdout (n=${result.queryWordingHoldout.queryCount}, labels not independently adjudicated): bounded search MRR ${result.queryWordingHoldout.baseline.meanReciprocalRank.toFixed(3)} → ${result.queryWordingHoldout.modelCandidate.meanReciprocalRank.toFixed(3)}; Recall@5 ${result.queryWordingHoldout.baseline.meanRecallAtK.toFixed(3)} → ${result.queryWordingHoldout.modelCandidate.meanRecallAtK.toFixed(3)}; all-visible MRR ${result.queryWordingHoldout.allVisibleBaseline.meanReciprocalRank.toFixed(3)} → ${result.queryWordingHoldout.allVisibleModelCandidate.meanReciprocalRank.toFixed(3)}; Recall@5 ${result.queryWordingHoldout.allVisibleBaseline.meanRecallAtK.toFixed(3)} → ${result.queryWordingHoldout.allVisibleModelCandidate.meanRecallAtK.toFixed(3)}.`);
            if (result.partialMetrics?.queryWordingHoldout) console.log(`  - Partial holdout after provider stop (${result.partialMetrics.queryWordingHoldout.completed}/${result.partialMetrics.queryWordingHoldout.total} queries): bounded MRR ${result.partialMetrics.queryWordingHoldout.baseline.meanReciprocalRank.toFixed(3)} → ${result.partialMetrics.queryWordingHoldout.candidate.meanReciprocalRank.toFixed(3)}; Recall@5 ${result.partialMetrics.queryWordingHoldout.baseline.meanRecallAtK.toFixed(3)} → ${result.partialMetrics.queryWordingHoldout.candidate.meanRecallAtK.toFixed(3)}; all-visible MRR ${result.partialMetrics.queryWordingHoldout.allVisibleBaseline.meanReciprocalRank.toFixed(3)} → ${result.partialMetrics.queryWordingHoldout.allVisibleCandidate.meanReciprocalRank.toFixed(3)}; Recall@5 ${result.partialMetrics.queryWordingHoldout.allVisibleBaseline.meanRecallAtK.toFixed(3)} → ${result.partialMetrics.queryWordingHoldout.allVisibleCandidate.meanRecallAtK.toFixed(3)}.`);
            if (result.expandedCandidatePool?.stratifiedMetrics) for (const [stratum, metrics] of Object.entries(result.expandedCandidatePool.stratifiedMetrics)) console.log(`  - All-visible ${stratum} (n=${metrics.cases}): MRR ${metrics.baseline.meanReciprocalRank.toFixed(3)} → ${metrics.modelCandidate.meanReciprocalRank.toFixed(3)}; Recall@5 ${metrics.baseline.meanRecallAtK.toFixed(3)} → ${metrics.modelCandidate.meanRecallAtK.toFixed(3)}; nDCG@5 ${metrics.baseline.meanNdcgAtK.toFixed(3)} → ${metrics.modelCandidate.meanNdcgAtK.toFixed(3)}.`);
            if (result.scoringDiagnostics && result.rankingDiagnostics) console.log(`  - Score distribution 0/1/2: ${result.scoringDiagnostics.distribution.unrelated}/${result.scoringDiagnostics.distribution.possible}/${result.scoringDiagnostics.distribution.strong}; varied-score queries ${result.scoringDiagnostics.queriesWithScoreVariation}/${result.queries}; changed top-five orders ${result.rankingDiagnostics.queriesWithChangedTopFive}/${result.queries}.`);
            if (result.stratifiedMetrics) for (const [stratum, metrics] of Object.entries(result.stratifiedMetrics)) console.log(`  - ${stratum} (n=${metrics.cases}): MRR ${metrics.baseline.meanReciprocalRank.toFixed(3)} → ${metrics.modelCandidate.meanReciprocalRank.toFixed(3)}; Recall@5 ${metrics.baseline.meanRecallAtK.toFixed(3)} → ${metrics.modelCandidate.meanRecallAtK.toFixed(3)}; nDCG@5 ${metrics.baseline.meanNdcgAtK.toFixed(3)} → ${metrics.modelCandidate.meanNdcgAtK.toFixed(3)}.`);
          }
          console.log('\nSynthetic labels only. Gemini/GroqCloud are test adapters; OpenRouter production routing is unchanged. Cost without a billing receipt remains unknown.');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-live-provider-evaluation
          path: |
            provider-eval.json
            provider-presence.json
            live-goal-plan-benchmark.json
            goal-architecture-benchmark.json
            blackboard-ranking-live.json
          if-no-files-found: warn
