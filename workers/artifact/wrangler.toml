name = "naelao-artifact"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[r2_buckets]]
binding = "ARTIFACT_BUCKET"
bucket_name = "naelao-artifacts"

[[r2_buckets]]
binding = "REPOSITORY_OBJECTS"
bucket_name = "naelao-repository-objects"

[[r2_buckets]]
binding = "WORKSPACE_R2"
bucket_name = "naelao-agent-scripts"

[[durable_objects.bindings]]
name = "REPOSITORY_DO"
class_name = "RepositoryDO"

# The Git projection publishes canonical file deltas only through the coordinator's
# checked session/stage/checkpoint API. This is an external namespace; RepositoryDO
# never writes the coordinator's content or manifest objects itself.
[[durable_objects.bindings]]
name = "WORKSPACE_COORDINATOR"
class_name = "WorkspaceCoordinatorDO"
script_name = "naelao-agents"

[[durable_objects.bindings]]
name = "CONCURRENCY_DO"
class_name = "ConcurrencyDO"
script_name = "naelao-agents"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepositoryDO"]

[vars]
ENVIRONMENT = "development"
UNIFIED_WORKSPACE_ENABLED = "false"

[env.staging]
vars = { ENVIRONMENT = "staging", UNIFIED_WORKSPACE_ENABLED = "false" }

[env.production]
vars = { ENVIRONMENT = "production", UNIFIED_WORKSPACE_ENABLED = "false" }

[[env.staging.r2_buckets]]
binding = "ARTIFACT_BUCKET"
bucket_name = "naelao-artifacts"


[[env.staging.r2_buckets]]
binding = "REPOSITORY_OBJECTS"
bucket_name = "naelao-repository-objects"


[[env.staging.r2_buckets]]
binding = "WORKSPACE_R2"
bucket_name = "naelao-agent-scripts"


[[env.staging.durable_objects.bindings]]
name = "REPOSITORY_DO"
class_name = "RepositoryDO"

[[env.staging.durable_objects.bindings]]
name = "WORKSPACE_COORDINATOR"
class_name = "WorkspaceCoordinatorDO"
script_name = "naelao-agents-staging"

[[env.staging.durable_objects.bindings]]
name = "CONCURRENCY_DO"
class_name = "ConcurrencyDO"
script_name = "naelao-agents-staging"


[[env.production.r2_buckets]]
binding = "ARTIFACT_BUCKET"
bucket_name = "naelao-artifacts"


[[env.production.r2_buckets]]
binding = "REPOSITORY_OBJECTS"
bucket_name = "naelao-repository-objects"


[[env.production.r2_buckets]]
binding = "WORKSPACE_R2"
bucket_name = "naelao-agent-scripts"


[[env.production.durable_objects.bindings]]
name = "REPOSITORY_DO"
class_name = "RepositoryDO"

[[env.production.durable_objects.bindings]]
name = "WORKSPACE_COORDINATOR"
class_name = "WorkspaceCoordinatorDO"
script_name = "naelao-agents-production"

[[env.production.durable_objects.bindings]]
name = "CONCURRENCY_DO"
class_name = "ConcurrencyDO"
script_name = "naelao-agents-production"
