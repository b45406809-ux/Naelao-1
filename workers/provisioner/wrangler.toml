name = "naelao-provisioner"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[queues.consumers]]
queue = "naelao-provisioning-queue"
# A single Space provisioning/deprovisioning saga performs many service and storage operations.
# Isolate one saga per invocation; max_concurrency retains bounded parallel throughput.
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
max_concurrency = 10
dead_letter_queue = "naelao-provisioning-dlq"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[[kv_namespaces]]
binding = "SPACES_KV"
id = "0fdaabda06a64e1f911c32fddde5718c"

# Service binding to naelao-spaces — provisioner registers each installed agent in the
# SpaceDO agent_definitions index (the code expects env.SPACES_WORKER, not an HTTP URL).
[[services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

# Service binding to naelao-agents — best-effort AgentMail email seed at provision time
# (holds AGENTMAIL_API_KEY). Optional: seedBusinessEmail no-ops when unbound/unconfigured.
[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

# Skill library / agent-config R2 — the provisioner writes each agent's 4 config files here.
[[r2_buckets]]
binding = "SCRIPTS_R2"
bucket_name = "naelao-agent-scripts"

# Portal slug→spaceId mapping written during external portal provisioning (step 7).
# Read by naelao-portal-router worker at request time. Optional — skipped if unbound.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "50fe6d17439d4b8082cdc827393fc87f"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[[env.staging.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[env.staging.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[env.production.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[env.staging.queues.consumers]]
queue = "naelao-provisioning-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
max_concurrency = 10
dead_letter_queue = "naelao-provisioning-dlq"


[[env.staging.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"


[[env.staging.kv_namespaces]]
binding = "SPACES_KV"
id = "0fdaabda06a64e1f911c32fddde5718c"

# Service binding to naelao-spaces — provisioner registers each installed agent in the
# SpaceDO agent_definitions index (the code expects env.SPACES_WORKER, not an HTTP URL).

[[env.staging.r2_buckets]]
binding = "SCRIPTS_R2"
bucket_name = "naelao-agent-scripts"

# Portal slug→spaceId mapping written during external portal provisioning (step 7).
# Read by naelao-portal-router worker at request time. Optional — skipped if unbound.

[[env.staging.kv_namespaces]]
binding = "PORTAL_KV"
id = "50fe6d17439d4b8082cdc827393fc87f"


[[env.production.queues.consumers]]
queue = "naelao-provisioning-queue"
max_batch_size = 1
max_batch_timeout = 30
