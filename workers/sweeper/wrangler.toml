name = "naelao-sweeper"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[[r2_buckets]]
binding = "KB_BUCKET"
bucket_name = "naelao-kb-documents"

[[vectorize]]
binding = "KB_VECTORS"
index_name = "naelao-kb-vectors"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.staging.triggers]
crons = []

[[env.staging.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[[env.staging.r2_buckets]]
binding = "KB_BUCKET"
bucket_name = "naelao-kb"

[[env.staging.vectorize]]
binding = "KB_VECTORS"
index_name = "naelao-kb-vectors"

[env.production]
vars = { ENVIRONMENT = "production" }

[env.production.triggers]
crons = ["0 3 * * *"]

[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[[env.production.r2_buckets]]
binding = "KB_BUCKET"
bucket_name = "naelao-kb"

[[env.production.vectorize]]
binding = "KB_VECTORS"
index_name = "naelao-kb-vectors"
