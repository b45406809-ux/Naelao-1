name = "naelao-sweeper"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[triggers]]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

[[r2_buckets]]
binding = "KB_BUCKET"
bucket_name = "naelao-kb-documents"

[[vectorize_indexes]]
binding = "KB_VECTORS"
index_name = "naelao-kb-prod"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
