name = "naelao-threads"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[[queues.producers]]
binding = "SESSIONS_QUEUE"
queue = "naelao-channel-sessions"

[vars]
ENVIRONMENT = "development"
LLM_GATEWAY_URL = "http://localhost:8788"

[env.staging]
vars = { ENVIRONMENT = "staging", LLM_GATEWAY_URL = "https://llm.naelao.com" }

[env.production]
vars = { ENVIRONMENT = "production", LLM_GATEWAY_URL = "https://llm.naelao.com" }

[[env.staging.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"


[[env.staging.queues.producers]]
binding = "SESSIONS_QUEUE"
queue = "naelao-channel-sessions"


[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"


[[env.production.queues.producers]]
binding = "SESSIONS_QUEUE"
queue = "naelao-channel-sessions"
