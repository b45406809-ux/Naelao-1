name = "naelao-agents"
main = "src/index.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "NAELAO_AGENT_DO"
class_name = "NaelaoAgentDO"

[[durable_objects.bindings]]
name = "HITL_APPROVAL_DO"
class_name = "HITLApprovalDO"

[[durable_objects.bindings]]
name = "TASK_DO"
class_name = "TaskDO"

[[durable_objects.bindings]]
name = "TOOL_SANDBOX"
class_name = "ToolSandboxDO"

[[durable_objects.bindings]]
name = "DOCUMENT_SANDBOX"
class_name = "DocumentSandboxDO"

[[durable_objects.bindings]]
name = "MEDIA_SANDBOX"
class_name = "MediaSandboxDO"

# §A1.17 Phase M — local-machine-as-container (spec gap G-3). One instance per (spaceId, userId);
# holds the WebSocket to a builder's own Naelao Local Agent client. No [[containers]] binding —
# this is not a CF Container, it relays to a real human's machine over WS.
[[durable_objects.bindings]]
name = "LOCAL_TUNNEL"
class_name = "LocalTunnelDO"

[[durable_objects.bindings]]
name = "RISK_GUARD"
class_name = "RiskGuardDO"

# Account-level concurrency ceiling (spec §28 "ConcurrencyDO") — gates simultaneous sub-agent
# spawn trees per (spaceId, holder). See buildOrchestrationHooks' spawnSubAgent in NaelaoAgentDO.
[[durable_objects.bindings]]
name = "CONCURRENCY_DO"
class_name = "ConcurrencyDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NaelaoAgentDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HITLApprovalDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["TaskDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ProductDO", "BusinessDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ToolSandboxDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ConcurrencyDO"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["LocalTunnelDO"]

# BusinessDO/ProductDO retired (legacy Whop-niche runtime, superseded by SpaceDO +
# NaelaoAgentDO + the script engine) — deleted_classes tells Cloudflare to decommission the
# underlying DO storage rather than leaving it orphaned. v4's new_classes entry above is left
# untouched (migration history is append-only, never rewritten).
[[migrations]]
tag = "v8"
deleted_classes = ["ProductDO", "BusinessDO"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["RiskGuardDO"]

[[durable_objects.bindings]]
name = "WORKFLOW_RUN_DO"
class_name = "WorkflowRunDO"

[[migrations]]
tag = "v10"
new_sqlite_classes = ["WorkflowRunDO"]

[[migrations]]
tag = "v11-containers"
new_sqlite_classes = ["DocumentSandboxDO", "MediaSandboxDO"]

# Tier-5 micro-tool build/test compute (WG-01). A Cloudflare Container attached to
# ToolSandboxDO — the agent spins it up on demand to build + test the micro-tool's
# code (Node, and Python for scripts that need it), and it sleeps when idle.
[[containers]]
class_name = "ToolSandboxDO"
image = "./Dockerfile.toolsandbox"
max_instances = 5
instance_type = "basic"

# Default scheduling is deliberate: dynamic durable_object image mode retains root caps.
# After building/publishing, configure CONTAINER_IMAGE_REGISTRY with real deployed digests.
# An empty registry disables sidecar execution. Never put guessed hashes in that variable.
[[containers]]
class_name = "DocumentSandboxDO"
image = "./Dockerfile.documents"
max_instances = 3
instance_type = "standard-1"

[[containers]]
class_name = "MediaSandboxDO"
image = "./Dockerfile.media"
max_instances = 3
instance_type = "standard-1"

# Script-first engine (authoritative agent model; spec appendix ~6672k):
# skill library + agent 4-file config + agent workspace, all keyed by space.
# Layout: spaces/{spaceId}/scripts/..., spaces/{spaceId}/agents/..., spaces/{spaceId}/workspace/...
[[r2_buckets]]
binding = "SCRIPTS_R2"
bucket_name = "naelao-agent-scripts"

# Vectorize index for script.find semantic search (spec §16). Optional — the engine
# degrades to a tag/text scan when absent.
[[vectorize]]
binding = "SCRIPTS_VECTORIZE"
index_name = "naelao-agent-scripts"

# Vectorize index for the Memory OS semantic layer (episodic facts promoted to long-term
# semantic memory, queried by embedding + user_id filter). Separate vector space/lifecycle
# from the skill-library index above.
[[vectorize]]
binding = "MEMORY_VECTORIZE"
index_name = "naelao-agent-memory"

# CF Worker Loader (beta) — dynamically spins up a fresh V8 isolate per script.run call for
# execution Tiers 2-4 (script-engine/code-runner.ts). Not yet in @cloudflare/workers-types;
# typed locally there. Optional — Tiers 2-4 degrade to "unavailable" without it (Tier 1 R2
# ops always work; Tier 5 container is unaffected).
# TEMPORARILY DISABLED: this binding requires the CF Workers PAID plan (account is on free tier
# as of this bootstrap phase) — deploying with it declared fails outright (error 10195), which
# was blocking even unrelated fixes from reaching this worker at all. Re-enable (uncomment) the
# moment the account upgrades to the $5/mo plan; the code already degrades to "unavailable"
# identically whether the binding is absent or present-but-unusable, so this is a zero-behavior-
# change toggle, not a functionality cut.
[[worker_loaders]]
binding = "LOADER"
#
# VERIFIED 2026-08-08, and the result is a trap worth writing down: uncommenting this and running
# `wrangler deploy` SUCCEEDS — it prints a normal deployment and a new Version ID — but Cloudflare
# silently DROPS the binding. `GET /accounts/{id}/workers/services/naelao-agents/environments/
# production/bindings` afterwards contains no LOADER, and a real Tier-2 script still fails with
# "Tier 2 is unavailable: no worker_loaders binding configured in this environment".
# So a successful deploy is NOT evidence that Worker Loaders is enabled. Check the bindings API.

[[workflows]]
name = "AgentTaskWorkflow"
class_name = "AgentTaskWorkflow"
binding = "AGENT_TASK_WORKFLOW"

[[workflows]]
name = "GenericSubagentWorkflow"
class_name = "GenericSubagentWorkflow"
binding = "GENERIC_SUBAGENT_WORKFLOW"

[[workflows]]
name = "CompanyAutomationWorkflow"
class_name = "CompanyAutomationWorkflow"
binding = "COMPANY_AUTOMATION_WORKFLOW"

# §A1.17 Phase J — durable execution for scripts tagged runtime:"workflow" (long-running/cron
# automations). Separate from AgentTaskWorkflow (which runs one full agent reasoning turn);
# this runs one named script directly, no reasoner, with step retries.
[[workflows]]
name = "ScriptRunWorkflow"
class_name = "ScriptRunWorkflow"
binding = "AGENT_SCRIPT_WORKFLOW"

[[workflows]]
name = "ScheduledReminderWorkflow"
class_name = "ScheduledReminderWorkflow"
binding = "SCHEDULED_REMINDER_WORKFLOW"

[[services]]
binding = "VOICE_CALLS"
service = "naelao-calls"

[[kv_namespaces]]
binding = "AGENT_CACHE"
id = "8564eeacd7b44efb88f71f39366ec4be"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "naelao_agent_events"

# Hourly "agent tick" fan-out (heartbeats, connector polls, scheduled jobs) — see
# enqueueAgentTicks/handleAgentTicksQueue in src/index.ts. scheduled() only does the cheap D1
# roster + isCronDue queries (no subrequests); each due tick becomes one queue message,
# processed by the queue() consumer. Without this, the old serial in-invocation loop broke the
# Workers 1000-subrequest limit at a few hundred active spaces.
[[queues.producers]]
binding = "AGENT_TICKS"
queue = "naelao-agent-ticks"

[[queues.consumers]]
queue = "naelao-agent-ticks"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
max_concurrency = 50
dead_letter_queue = "naelao-agent-ticks-dlq"

[triggers]
# Hourly → poll webhook-less connectors (e.g. Gumroad) + drain each space's channel heartbeat
# (unanswered messages) + Memory OS maintenance. (The old "0 2 * * *" daily trigger drove the
# retired BusinessDO/ProductDO nightly Whop cycle — removed alongside those DOs.)
crons = ["0 * * * *", "*/5 * * * *"]

[[services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[[services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"

# Billing worker — the reserved commerce script's only money-in path.
[[services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

# MCP hub — external-platform connector registry + tool proxy (mcp-connector prebuilt).
[[services]]
binding = "MCP_HUB"
service = "naelao-mcp-hub"

# Credentials vault — stores a connector's API key (the connect flow); only the name is referenced.
[[services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

# Phase 5: agent-authored deliverables (a rendered HTML page, a report) — space-scoped R2 storage
# distinct from r2-workspace's own scratch files. See workers/artifact's own header for why this
# binding + its requireInternalHmac gate replaced the worker's prior, unauthenticated shape.
[[services]]
binding = "ARTIFACT_WORKER"
service = "naelao-artifact"

# CF Browser Rendering proxy — Tier 4 of the execution ladder (code-runner.ts). Agents never
# get raw CDP; all browser ops are mediated by this Worker's SSRF guard + rate controls.
[[services]]
binding = "BROWSER_WORKER"
service = "naelao-browser"

# §A1.17 Phase V — naelao-ws-gateway. NaelaoAgentDO calls broadcastSpaceEvent (@naelao/http) so
# approval.requested live-syncs to any connected dashboard/shell client.
[[services]]
binding = "WS_GATEWAY"
service = "naelao-ws-gateway"

# PLATFORM_DB — this worker's src/index.ts declares `PLATFORM_DB: D1Database` on AgentsEnv and
# uses it in 31 places (agent/run's model + space lookup, bootstrap/complete, channel inbound,
# connector webhooks, template resolution...), but this binding was MISSING from wrangler.toml
# entirely, so `c.env.PLATFORM_DB` was undefined on the live worker and every one of those routes
# threw "Cannot read properties of undefined (reading 'prepare')". TypeScript cannot catch this:
# wrangler.toml is never typechecked against the Env interface. It went unnoticed because a
# separate PLATFORM_SECRET mismatch made every router-proxied request 401 before it could reach
# any of this code.
[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"
migrations_dir = "../../infra/migrations"

[vars]
DYNAMIC_PYTHON_ENABLED = "true"
ENVIRONMENT = "development"
# CF AI Gateway — every LLM call routes through this (spec §15).
# The real account id + gateway name (dash.cloudflare.com → account id in the URL/sidebar;
# AI → AI Gateway → the gateway's own id).
NAELAO_ACCOUNT_ID = "12e352dbea64627949c5e808c1ea92c3"
NAELAO_GATEWAY_ID = "naelao-gateway"
# CF API token for the Universal Endpoint's Workers AI fallback provider (cross-provider failover,
# spec §15). Required to use Workers AI through the Universal Endpoint (distinct from the AI
# binding used for direct calls — the Universal Endpoint needs a real API token).
# Set via `wrangler secret put CF_API_TOKEN`. When absent, Anthropic-only (no fallback).
# CF_API_TOKEN = ""  # set as a secret, not a plain var
#
# Vendor cutover: CF AI Gateway holds the LLM provider key (Authenticated Gateway / BYOK), so
# NO ANTHROPIC_API_KEY is needed on this worker. Configure the gateway with your Anthropic key
# in the CF dashboard, enable Authentication, and set the gateway token:
#   wrangler secret put NAELAO_AIG_TOKEN
# When NAELAO_AIG_TOKEN is unset AND no ANTHROPIC_API_KEY is provided, LLM calls fail honestly.
#
# System One decision sentry. The verified Cloudflare Clef route uses the existing AI binding:
#   SYSTEM_ONE_PROVIDER="clef"
#   SYSTEM_ONE_MODEL="@cf/cloudflare/clef-flash"  # or clef / clef-omni when appropriate
# Clef is opt-in; do not set it for spaces whose residency/egress policy forbids cloud inference.
# Jev remains an explicitly configured provider and requires its own current vendor validation:
#   wrangler secret put TYPESAFE_API_KEY
# A separately operated, policy-authorized endpoint can be set with SYSTEM_ONE_ENDPOINT and
# SYSTEM_ONE_PROVIDER="laya"; its wire contract and placement must be verified by its operator.
# A missing sentry never weakens deterministic routing.
#
# Google AI Studio (Gemini) — a genuinely separate provider relationship, BYOK to a real Google
# key (not held by the CF Gateway itself). Lets the model switcher offer Gemini models
# (google-ai-studio/gemini-flash-lite-latest / -flash-latest / -pro-latest) as a real fallback
# when the account's shared Workers AI neuron allowance is exhausted — see shared/ai-client.ts's
# isGoogleAiStudioModel doc for the routing details.
#   wrangler secret put GOOGLE_AI_STUDIO_API_KEY
# When unset, those model ids degrade honestly (give_up naming the missing secret) rather than
# firing a doomed request.

# CF Workers AI — used by free-tier agents and sub-agent vision tasks.
[ai]
binding = "AI"

[env.staging]
# wrangler does NOT merge [env.X].vars with the top-level [vars] block — it replaces it
# entirely. NAELAO_ACCOUNT_ID/NAELAO_GATEWAY_ID must be repeated here or every LLM call in
# staging silently falls back to the direct Anthropic API (resolveAnthropicUrl treats a missing
# accountId the same as "placeholder") — the CF AI Gateway wiring in shared/ai-client.ts would
# never actually activate.
vars = { ENVIRONMENT = "staging", NAELAO_ACCOUNT_ID = "12e352dbea64627949c5e808c1ea92c3", NAELAO_GATEWAY_ID = "naelao-gateway" }
# CF_API_TOKEN is a secret (not a var) — set via `wrangler secret put CF_API_TOKEN --env staging`

[[env.staging.services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[[env.staging.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[env.staging.services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[[env.staging.services]]
binding = "MCP_HUB"
service = "naelao-mcp-hub"

[[env.staging.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.staging.services]]
binding = "BROWSER_WORKER"
service = "naelao-browser"

[env.production]
# See [env.staging]'s comment above — same wrangler vars-replacement gotcha.
vars = { ENVIRONMENT = "production", NAELAO_ACCOUNT_ID = "12e352dbea64627949c5e808c1ea92c3", NAELAO_GATEWAY_ID = "naelao-gateway" }
# CF_API_TOKEN is a secret (not a var) — set via `wrangler secret put CF_API_TOKEN --env production`

[[env.production.services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[[env.production.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[env.production.services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[[env.production.services]]
binding = "MCP_HUB"
service = "naelao-mcp-hub"

[[env.production.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.production.services]]
binding = "BROWSER_WORKER"
service = "naelao-browser"
