name = "naelao-agents"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "NAELAO_AGENT_DO"
class_name = "NaelaoAgentDO"

[[migrations]]
tag = "v1"
new_classes = ["NaelaoAgentDO"]

[[kv_namespaces]]
binding = "AGENT_CACHE"
id = "REPLACE_WITH_KV_ID"

[vars]
ENVIRONMENT = "development"
ANTHROPIC_API_KEY = ""

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
