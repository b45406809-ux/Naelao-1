name = "naelao-agents"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "NAELAO_AGENT_DO"
class_name = "NaelaoAgentDO"

[[durable_objects.bindings]]
name = "HITL_APPROVAL_DO"
class_name = "HITLApprovalDO"

[[durable_objects.bindings]]
name = "TASK_DO"
class_name = "TaskDO"

[[durable_objects.bindings]]
name = "PRODUCT_DO"
class_name = "ProductDO"

[[durable_objects.bindings]]
name = "BUSINESS_DO"
class_name = "BusinessDO"

[[migrations]]
tag = "v1"
new_classes = ["NaelaoAgentDO"]

[[migrations]]
tag = "v2"
new_classes = ["HITLApprovalDO"]

[[migrations]]
tag = "v3"
new_classes = ["TaskDO"]

[[migrations]]
tag = "v4"
new_classes = ["ProductDO", "BusinessDO"]

[[r2_buckets]]
binding = "BUSINESS_R2"
bucket_name = "naelao-business-scripts"

# Tier-5 micro-tool build/test container (WG-01). Optional: when unbound, a tool
# version cannot leave `building` and therefore can never deploy — the §02 gate
# holds safely. Wire this to a Cloudflare Container service when one exists.
# [[services]]
# binding = "TOOL_SANDBOX"
# service = "naelao-tool-sandbox"

[[workflows]]
name = "AgentTaskWorkflow"
class_name = "AgentTaskWorkflow"
binding = "AGENT_TASK_WORKFLOW"

[[kv_namespaces]]
binding = "AGENT_CACHE"
id = "REPLACE_WITH_KV_ID"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "naelao_agent_events"

[triggers]
crons = ["0 2 * * *"]

[[services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[[services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[[env.staging.services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[[env.staging.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[[env.production.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"
