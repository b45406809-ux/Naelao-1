name = "workspace-coordinator-runtime-smoke"
main = "./worker.ts"
compatibility_date = "2026-11-08"

[vars]
PLATFORM_SECRET = "local-workspace-runtime-smoke-secret"

[[durable_objects.bindings]]
name = "WORKSPACE_COORDINATOR"
class_name = "WorkspaceCoordinatorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceCoordinatorDO"]

[[r2_buckets]]
binding = "SCRIPTS_R2"
bucket_name = "workspace-coordinator-runtime-smoke"
