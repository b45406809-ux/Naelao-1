name = "workspace-coordinator-runtime-smoke"
main = "./worker.ts"
compatibility_date = "2026-10-13"

# The smoke Worker fails closed unless run-specific disposable variables and secrets are
# supplied at startup. Never put PLATFORM_SECRET or WORKSPACE_SMOKE_TOKEN in this file.
# `UNIFIED_WORKSPACE_ENABLED=true` is only needed to exercise the disposable migration path.

[[durable_objects.bindings]]
name = "WORKSPACE_COORDINATOR"
class_name = "WorkspaceCoordinatorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceCoordinatorDO"]

[[r2_buckets]]
binding = "SCRIPTS_R2"
bucket_name = "workspace-coordinator-runtime-smoke"
