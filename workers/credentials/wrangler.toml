name = "naelao-credentials"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"
migrations_dir = "../../infra/migrations"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "naelao_events"

# Best-effort only (see CredentialsEnv.SPACES_WORKER doc comment) — lets a resolved fallback
# fire credential.fallback_used through SpaceDO's existing generic event ingress.
[[services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }
[[env.staging.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[env.production]
vars = { ENVIRONMENT = "production" }
[[env.production.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"
