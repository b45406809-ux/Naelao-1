name = "naelao-analytics"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "naelao_analytics"

[[kv_namespaces]]
binding = "METRICS_CACHE"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

[vars]
ENVIRONMENT = "development"
CF_ACCOUNT_ID = ""
CF_ANALYTICS_API_TOKEN = ""

[env.staging]
# wrangler does NOT merge [env.X].vars with the top-level [vars] block — it replaces it
# entirely, so CF_ACCOUNT_ID/CF_ANALYTICS_API_TOKEN must be repeated here or they're undefined
# in staging. Override CF_ANALYTICS_API_TOKEN via `wrangler secret put ... --env staging`.
vars = { ENVIRONMENT = "staging", CF_ACCOUNT_ID = "", CF_ANALYTICS_API_TOKEN = "" }

[env.production]
# See [env.staging]'s comment above — same wrangler vars-replacement gotcha.
vars = { ENVIRONMENT = "production", CF_ACCOUNT_ID = "", CF_ANALYTICS_API_TOKEN = "" }
