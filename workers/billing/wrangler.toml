name = "naelao-billing"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "REPLACE_WITH_DB_ID"

[[kv_namespaces]]
binding = "QUOTA_CACHE"
id = "REPLACE_WITH_KV_ID"

[[queues.producers]]
binding = "BILLING_EVENTS"
queue = "naelao-billing-events"

[[queues.consumers]]
queue = "naelao-billing-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "naelao-billing-events-dlq"

[vars]
ENVIRONMENT = "development"
STRIPE_PUBLISHABLE_KEY = ""

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
