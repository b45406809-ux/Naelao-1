name = "naelao-billing"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# F20 / A1.16.8 fix: this worker must never be reachable directly — naelao-router is the only
# public API surface. /internal/* routes below are additionally gated with requireInternalHmac,
# but a direct workers.dev reachability is the same tenant-spoofing hole B1/A1.16.8 closed
# everywhere else; this worker was missed.
workers_dev = false

[triggers]
crons = ["0 0 * * *", "15 * * * *"]
# Optional native FDE settlement: STRIPE_CONNECT_SECRET_KEY, active Connect destinations,
# an authorized partner opt-in or withdrawal request, and a funded Stripe platform balance.
# This does not move a userland business wallet or a Lemon Squeezy balance.

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[[kv_namespaces]]
binding = "QUOTA_CACHE"
id = "0b8cfd9b3d4c4aa5a7b14c343aeab8fe"

[[queues.producers]]
binding = "BILLING_EVENTS"
queue = "naelao-billing-events"

[[queues.consumers]]
queue = "naelao-billing-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
max_concurrency = 50
dead_letter_queue = "naelao-billing-events-dlq"

# Billing provider: Lemon Squeezy ONLY (Stripe removed in the vendor cutover).
# Secrets (set via `wrangler secret put`, per environment):
#   LEMON_SQUEEZY_API_KEY             — LS API key (app.lemonsqueezy.com → Settings → API)
#   LEMON_SQUEEZY_STORE_ID            — Naelao's LS store id
#   LEMON_SQUEEZY_WEBHOOK_SECRET      — signing secret of the LS webhook pointed at
#                                       /v1/webhooks/lemon-squeezy
#   LEMON_SQUEEZY_GROWTH_VARIANT_ID   — LS subscription variant for the builder Growth plan
#   LEMON_SQUEEZY_BUSINESS_VARIANT_ID — LS subscription variant for the builder Business plan
#   PLATFORM_SECRET                   — shared inter-worker HMAC secret (same value everywhere)
# The plan variants are created ONCE in the Naelao LS store (Products → New → subscription);
# without them /billing/checkout degrades to the dev-placeholder flow.
[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

# Seat purchases activate the member in SpaceDO via the spaces worker.
[[services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

# Whop sub-merchant wallets: vaults payout destination details (AES-256-GCM in the credentials
# worker — never D1 plaintext).
# Additional secrets (set via `wrangler secret put`, per environment):
#   WHOP_PLATFORM_API_KEY — Naelao's ONE Whop master Platform account API key (sub-merchant
#                           provisioning, balance reads, checkouts, withdrawals)
#   WHOP_WEBHOOK_SECRET   — signing secret of the Whop webhook → /v1/webhooks/whop
# And a per-environment var:
#   PUBLIC_WEBHOOK_BASE_URL — public base URL for the one-time payout approval email link
[[services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

# Sends the one-time payout approval email.
[[services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"

[vars]
ENVIRONMENT = "development"

[env.staging]
# wrangler does NOT merge [env.X].vars with the top-level [vars] block — it replaces it
# entirely; any var added above must be repeated per environment.
vars = { ENVIRONMENT = "staging" }

[[env.staging.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[env.staging.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[env.staging.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.staging.services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"

[env.production]
# See [env.staging]'s comment above — same wrangler vars-replacement gotcha.
vars = { ENVIRONMENT = "production" }

[[env.production.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[env.production.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[env.production.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.production.services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"
