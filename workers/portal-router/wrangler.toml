name = "naelao-portal-router"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PORTAL_DOMAINS"
id = "PLACEHOLDER_KV_ID"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

# Storefront buy/join buttons initiate the reserved money-in checkout via the billing worker.
[[services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[vars]
ENVIRONMENT = "development"
PORTAL_ORIGIN = "https://portal.naelao.app"

[env.staging]
vars = { ENVIRONMENT = "staging", PORTAL_ORIGIN = "https://portal.staging.naelao.app" }

[[env.staging.services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[env.production]
vars = { ENVIRONMENT = "production", PORTAL_ORIGIN = "https://portal.naelao.app" }

[[env.production.services]]
binding = "BILLING_WORKER"
service = "naelao-billing"
