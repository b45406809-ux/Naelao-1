name = "naelao-eval"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

# §A1 Harness Excellence Phase HX3 — needed so mode="agent" eval runs can dispatch a real
# /agent/run per case instead of only ever judging the raw case input text.
[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[vars]
ENVIRONMENT = "development"
# §A1 Harness Excellence Phase HX3: this worker previously called api.anthropic.com directly
# with a hardcoded EVAL_LLM_URL, bypassing the CF AI Gateway vendor cutover (item 45) every other
# LLM call site in the platform already went through. NAELAO_ACCOUNT_ID/GATEWAY_ID route the judge
# call through the gateway (same account/gateway as every other worker); NAELAO_AIG_TOKEN is a
# secret (`wrangler secret put NAELAO_AIG_TOKEN`) that lets the gateway hold the Anthropic key
# itself, so no EVAL_LLM_KEY is required once it's set.
NAELAO_ACCOUNT_ID = "12e352dbea64627949c5e808c1ea92c3"
NAELAO_GATEWAY_ID = "naelao-gateway"
# Which model the JUDGE runs on. Deliberately a var, not a hardcoded constant: the previous
# hardcoded Claude id does not resolve on every account's gateway (it does not on this one), which
# silently scored every judged case 0 and read as "every model failed" rather than "the judge
# never ran". CF_API_TOKEN is a secret (`wrangler secret put CF_API_TOKEN`).
EVAL_JUDGE_MODEL = "@cf/openai/gpt-oss-120b"

[env.staging]
# wrangler does NOT merge [env.X].vars with the top-level [vars] block — it replaces it
# entirely, so these must be repeated here or judge calls silently fall back to a direct
# Anthropic call in staging (the same gotcha every other worker's wrangler.toml documents).
vars = { ENVIRONMENT = "staging", NAELAO_ACCOUNT_ID = "12e352dbea64627949c5e808c1ea92c3", NAELAO_GATEWAY_ID = "naelao-gateway", EVAL_JUDGE_MODEL = "@cf/openai/gpt-oss-120b" }

[[env.staging.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[env.production]
# See [env.staging]'s comment above — same wrangler vars-replacement gotcha.
vars = { ENVIRONMENT = "production", NAELAO_ACCOUNT_ID = "12e352dbea64627949c5e808c1ea92c3", NAELAO_GATEWAY_ID = "naelao-gateway", EVAL_JUDGE_MODEL = "@cf/openai/gpt-oss-120b" }

[[env.production.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[env.staging.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

# §A1 Harness Excellence Phase HX3 — needed so mode="agent" eval runs can dispatch a real
# /agent/run per case instead of only ever judging the raw case input text.

[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

# §A1 Harness Excellence Phase HX3 — needed so mode="agent" eval runs can dispatch a real
# /agent/run per case instead of only ever judging the raw case input text.
