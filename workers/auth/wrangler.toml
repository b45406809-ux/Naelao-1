name = "naelao-auth"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[vars]
ENVIRONMENT = "development"
JWT_EXPIRY_SECONDS = "3600"
# Launch-readiness audit follow-up — builder password reset. Public base URL of apps/dashboard,
# used to build a clickable reset link. Left empty rather than guessing a production domain —
# when unset, the reset email still carries a raw token the dashboard's reset page accepts
# pasted in by hand.
BUILDER_DASHBOARD_URL = ""

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

# Launch-readiness audit follow-up — password-reset emails.
[[services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"

# F-13: auth was the ONE worker with no named-environment blocks. The prod/staging deploys
# select an env with --env=<name>; without these blocks the worker deployed with the top-level
# ENVIRONMENT="development" config (localhost links) even in production. wrangler REPLACES (not
# merges) top-level [vars] for a named env, so every var must be repeated here. Binding tables
# ([[d1_databases]], [[services]]) DO inherit from the top level, so they don't.
[env.staging]
name = "naelao-auth-staging"
vars = { ENVIRONMENT = "staging", JWT_EXPIRY_SECONDS = "3600", BUILDER_DASHBOARD_URL = "https://staging-dashboard.naelao.com" }

[env.production]
name = "naelao-auth-production"
vars = { ENVIRONMENT = "production", JWT_EXPIRY_SECONDS = "3600", BUILDER_DASHBOARD_URL = "https://dashboard.naelao.com" }
