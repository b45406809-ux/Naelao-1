name = "naelao-mcp-hub"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

# Credentials worker — resolves an MCP server's auth_secret_name → plaintext at call time
# (AES-256-GCM vault). The secret is never stored in mcp_servers; only its name is.
[[services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[[env.staging.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"
