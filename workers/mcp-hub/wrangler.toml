name = "naelao-mcp-hub"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

# Secrets (set via `wrangler secret put`, never committed):
#   PLATFORM_SECRET    — internal HMAC + credential-token signing
#   COMPOSIO_API_KEY   — G-BF02 UNIVERSAL platform-provided connector key. Naelao holds ONE
#                        Composio key so provider-backed connectors work with zero builder
#                        configuration (like Claude/ChatGPT bundling connectors) — never the
#                        BYO space-credential model, which stays for a builder's OWN provider
#                        project. Optional: unset → provider-routed calls without a BYO
#                        credential return provider_not_configured.
#   PIPEDREAM_CLIENT_ID / PIPEDREAM_CLIENT_SECRET — same doctrine, Pipedream Connect. Unlike
#                        Composio, Pipedream's REST API is OAuth client_credentials-only (no
#                        static API key) — this worker exchanges these for a short-lived access
#                        token itself (see getPipedreamAccessToken in src/index.ts).

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

# Credentials worker — resolves an MCP server's auth_secret_name → plaintext at call time
# (AES-256-GCM vault). The secret is never stored in mcp_servers; only its name is.
[[services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

# OAuth2 connectors (e.g. Whop's "Sign in with Whop"): buildAuthHeaders proactively refreshes a
# near-expiry access token by calling the agents worker's internal refresh endpoint — the ONLY
# place that holds the Whop OAuth client secret, so it never needs duplicating onto this worker.
[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[vars]
ENVIRONMENT = "development"
# "development" or "production" — sent as x-pd-environment on every Pipedream Connect call.
# Remember the wrangler vars-replacement trap (item 41): repeated per env block below, not merged.
PIPEDREAM_ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging", PIPEDREAM_ENVIRONMENT = "development" }

[[env.staging.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.staging.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[env.production]
vars = { ENVIRONMENT = "production", PIPEDREAM_ENVIRONMENT = "production" }

[[env.production.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.production.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"
