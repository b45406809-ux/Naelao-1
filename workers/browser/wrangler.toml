name = "naelao-browser"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

browser = { binding = "BROWSER" }

[[durable_objects.bindings]]
name = "BROWSER_SESSION_DO"
class_name = "BrowserSessionDO"

[[migrations]]
tag = "v1-browser-sessions"
new_sqlite_classes = ["BrowserSessionDO"]

[[r2_buckets]]
binding = "BROWSER_ARTIFACTS"
bucket_name = "naelao-browser-artifacts"

[[services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }
browser = { binding = "BROWSER" }

[[env.staging.durable_objects.bindings]]
name = "BROWSER_SESSION_DO"
class_name = "BrowserSessionDO"
[[env.staging.r2_buckets]]
binding = "BROWSER_ARTIFACTS"
bucket_name = "naelao-browser-artifacts-staging"
[[env.staging.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces-staging"

[env.production]
vars = { ENVIRONMENT = "production" }
browser = { binding = "BROWSER" }

[[env.production.durable_objects.bindings]]
name = "BROWSER_SESSION_DO"
class_name = "BrowserSessionDO"
[[env.production.r2_buckets]]
binding = "BROWSER_ARTIFACTS"
bucket_name = "naelao-browser-artifacts"
[[env.production.services]]
binding = "SPACES_WORKER"
service = "naelao-spaces-production"
