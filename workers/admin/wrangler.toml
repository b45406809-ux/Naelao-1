name = "naelao-admin"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "naelao_events"

[[queues.consumers]]
queue = "naelao-dlq"
binding = "DLQ"
max_batch_size = 10
max_retries = 0

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
