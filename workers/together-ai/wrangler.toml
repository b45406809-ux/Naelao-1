name = "naelao-together-ai"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[vars]
ENVIRONMENT = "development"
TOGETHER_API_URL = "https://api.together.xyz/v1"

[env.staging]
vars = { ENVIRONMENT = "staging", TOGETHER_API_URL = "https://api.together.xyz/v1" }

[env.production]
vars = { ENVIRONMENT = "production", TOGETHER_API_URL = "https://api.together.xyz/v1" }
