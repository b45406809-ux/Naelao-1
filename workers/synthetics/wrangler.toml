name = "naelao-synthetics"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[triggers]]
crons = ["* * * * *"]

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[vars]
ENVIRONMENT = "development"
PLATFORM_API_URL = "https://api.naelao.com"

[env.staging]
vars = { ENVIRONMENT = "staging", PLATFORM_API_URL = "https://api.staging.naelao.com" }

[env.production]
vars = { ENVIRONMENT = "production", PLATFORM_API_URL = "https://api.naelao.com" }
