name = "naelao-spaces"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[[worker_loaders]]
binding = "LOADER"

[[durable_objects.bindings]]
name = "CONFORMANCE_SANDBOX_DO"
class_name = "ConformanceSandboxDO"

[[workflows]]
binding = "BLUEPRINT_CONFORMANCE_WORKFLOW"
name = "BlueprintConformanceWorkflow"
class_name = "BlueprintConformanceWorkflow"

[[services]]
binding = "CONFORMANCE_EXECUTOR"
service = "naelao-spaces"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "naelao_agent_events"

[vars]
ENVIRONMENT = "development"
# Public base URL of apps/shell, used to build a clickable email-verification link
# ("${base}/p/{slug}/verify-email?token=..."). Was left empty deliberately rather than guessing a
# production domain — the verification email still carried a raw token either way, and the
# shell's verify-email page accepts a manually pasted one — but a live-reported bug confirmed
# this is genuinely the difference between "click a link" and "notice, copy, and correctly paste
# an opaque token string buried in an email," which several real users did not manage to do. Now
# set to the real, live Product Shell domain (see CLAUDE.md's Live Deployment Facts).
PRODUCT_SHELL_URL = "https://naelao-shell.pages.dev"

# The internal product dashboard is restricted to this org/tenant ID. Configure the same value
# in each deployed environment (and the matching local .dev.vars) before granting dashboard
# access. Launchpad bootstrap also uses this tenant: set it to an existing active org.
# On a fresh database the worker creates the Launchpad root on the first Launchpad lookup or
# scheduled run. Existing differently named roots require an explicit migration first.
# Production also requires the provisioning queue. Bootstrap never claims an unrelated root.
#   wrangler secret put NAELAO_DASHBOARD_TENANT_ID

# Cloudflare for SaaS custom-hostname provisioning (storefront custom domains).
# Set the real values at deploy time as secrets:
#   wrangler secret put CF_API_TOKEN      (zone-scoped: SSL and Certificates: Edit)
#   wrangler secret put CF_SAAS_ZONE_ID   (the naelao.com SaaS zone id)
# When unset, custom-domain requests are recorded as pending_dns (no live API call).
#
# Public dynamic pages require a separately owned preview zone, for example a dedicated
# registrable suffix with a wildcard Worker route to this Worker. Set
# APPLICATION_HOST_SUFFIX and DYNAMIC_PAGE_HOST_SUFFIX only after verifying they are
# separate cookie domains and provisioning the wildcard route. Pages stay disabled otherwise.

[[durable_objects.bindings]]
name = "SPACE_DO"
class_name = "SpaceDO"

[[durable_objects.bindings]]
name = "LOCK_DO"
class_name = "LockDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpaceDO"]

[[durable_objects.bindings]]
name = "FEATURE_FLAG_DO"
class_name = "FeatureFlagDO"

[[durable_objects.bindings]]
name = "TRANSACTION_COORDINATOR_DO"
class_name = "TransactionCoordinatorDO"

# SpaceTypeRegistryDO — global singleton, one instance for the whole platform.
# Space Types are exclusively authored by Naelao (spec §62 / CLAUDE.md #7).
[[durable_objects.bindings]]
name = "SPACE_TYPE_REGISTRY_DO"
class_name = "SpaceTypeRegistryDO"

# Three-Tier Platform Model, Phase 1 (docs/spec-appendix A1.17) — one per builder (tenant).
[[durable_objects.bindings]]
name = "BUILDER_ACCOUNT_DO"
class_name = "BuilderAccountDO"

# Three-Tier Platform Model, Phase 2 — one per (productId, endUserId). The platform's first
# persistent signed-in end-user identity (credit ledger, sessions, preferences).
[[durable_objects.bindings]]
name = "PRODUCT_USER_DO"
class_name = "ProductUserDO"

[[durable_objects.bindings]]
name = "MICRO_APP_DO"
class_name = "MicroAppDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LockDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FeatureFlagDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["TransactionCoordinatorDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["SpaceTypeRegistryDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["BuilderAccountDO"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ProductUserDO"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["MicroAppDO"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["ConformanceSandboxDO"]

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"
migrations_dir = "../../infra/migrations"

[[r2_buckets]]
binding = "EXPORTS_BUCKET"
bucket_name = "naelao-exports"

# F-39: read-only access to the agent workspace bucket so the builder/end-user file viewer can
# list + read a project's R2 workspace files (spaces/{id}/projects/{id}/workspace/...). Same
# bucket the agents worker writes to via SCRIPTS_R2.
[[r2_buckets]]
binding = "SCRIPTS_R2"
bucket_name = "naelao-agent-scripts"

# KV for caching SpaceType manifests (TTL 1h — provisioner reads this before hitting the DO)
[[kv_namespaces]]
binding = "NAELAO_CONFIG_KV"
id = "2816ec20283b4ecd8c5b43e3ebe18b77"

# Producer to the provisioning queue — on space creation we enqueue a space_provision
# message; naelao-provisioner consumes it and installs the SpaceType's agents.
[[queues.producers]]
binding = "PROVISION_QUEUE"
queue = "naelao-provisioning-queue"

[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "naelao-events"

# Billing worker — called at product publish time to auto-create LS product + variant.
[[services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

# Agents worker — SpaceDO fires event_triggers (thread.created, project.created, ...) by
# calling into this internal route; the fired action is always just script.run (@naelao/events).
[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

# §A1.17 Phase V — naelao-ws-gateway. SpaceDO calls broadcastSpaceEvent (@naelao/http) on every
# project/thread-lock/presence mutation to live-sync connected dashboard/shell clients.
[[services]]
binding = "WS_GATEWAY"
service = "naelao-ws-gateway"

# Security audit follow-up — password-reset emails (product-end-user-routes.ts).
[[services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"

[[services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[env.staging]
# wrangler does NOT merge [env.X].vars with the top-level [vars] block — it replaces it
# entirely, so PRODUCT_SHELL_URL must be repeated here or it's undefined in staging. Override
# with the real staging shell URL once one is deployed.
vars = { ENVIRONMENT = "staging", PRODUCT_SHELL_URL = "" }

[[env.staging.services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[[env.staging.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[env.staging.services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"

[[env.staging.services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[env.production]
# See [env.staging]'s comment above — same wrangler vars-replacement gotcha. Real deploys of this
# worker use bare `wrangler deploy` (top-level [vars]), not --env production (item 83's own
# documented convention for naelao-agents applies here too) — kept in sync anyway so a future
# --env production deploy doesn't silently regress to an empty PRODUCT_SHELL_URL.
vars = { ENVIRONMENT = "production", PRODUCT_SHELL_URL = "https://naelao-shell.pages.dev" }

[[env.production.services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[[env.production.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[env.production.services]]
binding = "NOTIFICATIONS_WORKER"
service = "naelao-notifications"

[[env.production.services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

