name = "naelao-triggers"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[triggers]]
crons = ["* * * * *"]

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

[[queues.producers]]
binding = "SESSIONS_QUEUE"
queue = "naelao-channel-sessions"

# Preferred: call agents worker directly for cron-triggered script/run (spec §9)
[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[[env.staging.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"
