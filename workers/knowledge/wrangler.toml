name = "naelao-knowledge"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

# Secrets (set via `wrangler secret put`, never committed):
#   PLATFORM_SECRET  — internal HMAC + tenant auth
#   TAVILY_API_KEY   — UNIVERSAL platform-provided web search. Naelao holds ONE provider key
#                      here so every agent gets web search for free (like Claude/ChatGPT bundle
#                      it) — never the BYO-key space_credentials model. Optional: when unset,
#                      web-search `search`/`extract` report configured:false; `fetch` still works.
#   COHERE_API_KEY   — required for PDF/layout ingestion through Cohere parse-v5.0. Ingestion
#                      fails closed when a parse-required document is submitted without it.

[ai]
binding = "AI"

[[services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[[kv_namespaces]]
binding = "KB_CACHE"
id = "bd6fe7b9c8eb40c8922c85249888add7"

[[r2_buckets]]
binding = "KB_BUCKET"
bucket_name = "naelao-kb"

[[vectorize]]
binding = "KB_VECTORS"
index_name = "naelao-kb-vectors"

[[vectorize]]
binding = "SEMANTIC_CACHE_VECTORS"
index_name = "naelao-semantic-cache"

[[kv_namespaces]]
binding = "SEMANTIC_CACHE_KV"
id = "10ca4ecaba3e40deaf7e7cb53ed7c5cf"

[[analytics_engine_datasets]]
binding = "KNOWLEDGE_ANALYTICS"
dataset = "naelao_knowledge_retrieval"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"
migrations_dir = "../../infra/migrations"

[vars]
ENVIRONMENT = "development"
RETRIEVAL_POLICY_VERSION = "1"
RETRIEVAL_CONFIDENCE_THRESHOLD = "0.85"

[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "naelao-events"

[env.staging]
vars = { ENVIRONMENT = "staging", RETRIEVAL_POLICY_VERSION = "1", RETRIEVAL_CONFIDENCE_THRESHOLD = "0.85" }

[[env.staging.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "naelao-events"

[[env.staging.services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[env.production]
vars = { ENVIRONMENT = "production", RETRIEVAL_POLICY_VERSION = "1", RETRIEVAL_CONFIDENCE_THRESHOLD = "0.85" }

[[env.production.queues.producers]]
