name = "naelao-knowledge"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

# Secrets (set via `wrangler secret put`, never committed):
#   PLATFORM_SECRET  — internal HMAC + tenant auth
#   TAVILY_API_KEY   — UNIVERSAL platform-provided web search. Naelao holds ONE provider key
#                      here so every agent gets web search for free (like Claude/ChatGPT bundle
#                      it) — never the BYO-key space_credentials model. Optional: when unset,
#                      web-search `search`/`extract` report configured:false; `fetch` still works.

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "KB_CACHE"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "KB_BUCKET"
bucket_name = "naelao-kb"

[[vectorize]]
binding = "KB_VECTORS"
index_name = "naelao-kb-vectors"

[[vectorize]]
binding = "SEMANTIC_CACHE_VECTORS"
index_name = "naelao-semantic-cache"

[[kv_namespaces]]
binding = "SEMANTIC_CACHE_KV"
id = "REPLACE_WITH_SEMANTIC_CACHE_KV_ID"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "PLACEHOLDER_D1_ID"

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
