name = "naelao-ws-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "web_socket_pair_creator"]

[[durable_objects.bindings]]
name = "WS_HUB"
class_name = "WsHubDO"

[[migrations]]
tag = "v1"
new_classes = ["WsHubDO"]

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
