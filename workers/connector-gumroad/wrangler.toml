name = "naelao-connector-gumroad"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# The Gumroad MCP shim. Deployed behind the catalogue's mcp_endpoint
# (https://mcp.naelao.com/connectors/gumroad). mcp-hub calls `${mcp_endpoint}/mcp` with the
# builder's Gumroad access token as a Bearer token (resolved from the vault); the shim appends
# it as the access_token query param Gumroad expects. Holds no secrets.

[vars]
ENVIRONMENT = "development"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
