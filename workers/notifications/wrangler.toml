name = "naelao-notifications"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# B1 fix: this worker must never be reachable directly — naelao-router is the only public
# API surface. Identity headers (x-naelao-tenant-id/role/user-id) are trusted as-is by
# downstream workers, so direct workers.dev reachability is a tenant-spoofing hole.
workers_dev = false

[[queues.consumers]]
queue = "naelao-notifications-queue"
max_batch_size = 10
max_batch_timeout = 10
max_retries = 3
max_concurrency = 50
dead_letter_queue = "naelao-notifications-dlq"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"

[vars]
ENVIRONMENT = "development"
RESEND_API_URL = "https://api.resend.com"

[env.staging]
vars = { ENVIRONMENT = "staging", RESEND_API_URL = "https://api.resend.com" }

[env.production]
vars = { ENVIRONMENT = "production", RESEND_API_URL = "https://api.resend.com" }

# Chat-channel replies (Slack/Discord/Telegram/WhatsApp) resolve the space's own bot token
# from the vault at send time — see resolveChannelCredential.
[[services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.staging.queues.consumers]]
queue = "naelao-notifications-queue"
max_batch_size = 10
max_batch_timeout = 10
max_retries = 3
max_concurrency = 50
dead_letter_queue = "naelao-notifications-dlq"


[[env.staging.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"


[[env.staging.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[env.production.queues.consumers]]
queue = "naelao-notifications-queue"
max_batch_size = 10
max_batch_timeout = 10
max_retries = 3
max_concurrency = 50
dead_letter_queue = "naelao-notifications-dlq"


[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"


[[env.production.services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"
