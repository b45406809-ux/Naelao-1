name = "naelao-router"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
CORS_ALLOWLIST = "http://localhost:3000,http://localhost:3001,http://localhost:3100,https://naelao-dashboard.pages.dev,https://naelao-portal.pages.dev,https://naelao-shell.pages.dev,https://naelao-marketplace.pages.dev"
PRODUCT_SHELL_URL = "http://localhost:3100"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-platform"
database_id = "f29714eb-28bd-4c76-895d-eb186e92a88f"
migrations_dir = "../../infra/migrations"

[[kv_namespaces]]
binding = "SESSION_REVOCATION"
id = "3f2a9f17b80d48db915bc8261f606155"
preview_id = "3f2a9f17b80d48db915bc8261f606155"

[[kv_namespaces]]
binding = "CONFIG"
id = "8af2d30b39db44ffa3ec8aca10d2ef8a"
preview_id = "8af2d30b39db44ffa3ec8aca10d2ef8a"

[[kv_namespaces]]
binding = "NONCE_STORE"
id = "d9668899b225423a980124f4ff38eeb0"
preview_id = "d9668899b225423a980124f4ff38eeb0"

[[kv_namespaces]]
binding = "QUOTA_CACHE"
id = "0b8cfd9b3d4c4aa5a7b14c343aeab8fe"
preview_id = "0b8cfd9b3d4c4aa5a7b14c343aeab8fe"

[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDO"]

[[services]]
binding = "SPACES_WORKER"
service = "naelao-spaces"

[[services]]
binding = "KNOWLEDGE_WORKER"
service = "naelao-knowledge"

[[services]]
binding = "EVAL_WORKER"
service = "naelao-eval"

[[services]]
binding = "AGENTS_WORKER"
service = "naelao-agents"

[[services]]
binding = "AUTH_WORKER"
service = "naelao-auth"

[[services]]
binding = "CREDENTIALS_WORKER"
service = "naelao-credentials"

[[services]]
binding = "ANALYTICS_WORKER"
service = "naelao-analytics"

# F-2: billing worker — the public Lemon Squeezy webhook ingress (/v1/webhooks/lemon-squeezy)
# proxies here. Inherited by the staging/production named environments (only vars are replaced
# per-env, not binding tables — see wrangler-vars-parity.test.ts).
[[services]]
binding = "BILLING_WORKER"
service = "naelao-billing"

[[services]]
binding = "MARKETPLACE_WORKER"
service = "naelao-marketplace"

[env.staging]
name = "naelao-router-staging"
vars = { ENVIRONMENT = "staging", CORS_ALLOWLIST = "https://staging-dashboard.naelao.com,https://staging-portal.naelao.com,https://staging-app.naelao.com", PRODUCT_SHELL_URL = "https://staging-app.naelao.com" }

[env.production]
name = "naelao-router-production"
vars = { ENVIRONMENT = "production", CORS_ALLOWLIST = "https://dashboard.naelao.com,https://portal.naelao.com,https://app.naelao.com", PRODUCT_SHELL_URL = "https://app.naelao.com" }

[env.staging.ai]
