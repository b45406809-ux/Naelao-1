name = "naelao-blackboard-spaces-test"
main = "./spaces-worker-test-entry.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "SPACE_DO"
class_name = "SpaceDO"

[[durable_objects.bindings]]
name = "PRODUCT_USER_DO"
class_name = "ProductUserDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimitDO"

[[durable_objects.bindings]]
name = "SPACE_TYPE_REGISTRY_DO"
class_name = "SpaceTypeRegistryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpaceDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ProductUserDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["SpaceTypeRegistryDO"]

[[kv_namespaces]]
binding = "NAELAO_CONFIG_KV"
id = "naelao-browser-space-config"

[[kv_namespaces]]
binding = "SESSION_REVOCATION"
id = "naelao-browser-session-revocation"

[[kv_namespaces]]
binding = "CONFIG"
id = "naelao-browser-config"

[[kv_namespaces]]
binding = "NONCE_STORE"
id = "naelao-browser-nonce-store"

[[kv_namespaces]]
binding = "QUOTA_CACHE"
id = "naelao-browser-quota-cache"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-blackboard-test"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../../infra/migrations"

[vars]
PLATFORM_SECRET = "blackboard-integration-test-secret"
JWT_SECRET = "browser-runtime-test-jwt-secret"
ENVIRONMENT = "test"
CORS_ALLOWLIST = "http://127.0.0.1:3100,http://localhost:3100"
