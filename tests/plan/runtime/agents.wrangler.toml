name = "naelao-blackboard-agents-test"
main = "./agents-worker-test-entry.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "NAELAO_AGENT_DO"
class_name = "NaelaoAgentDO"

[[durable_objects.bindings]]
name = "CONCURRENCY_DO"
class_name = "ConcurrencyDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NaelaoAgentDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ConcurrencyDO"]

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "naelao-blackboard-test"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../../infra/migrations"

[[services]]
binding = "SPACES_WORKER"
service = "naelao-blackboard-spaces-test"

[[services]]
binding = "MODEL_GATEWAY"
service = "naelao-blackboard-model-test"

[[services]]
binding = "ARTIFACT_WORKER"
service = "naelao-blackboard-artifacts-test"

[[r2_buckets]]
binding = "SCRIPTS_R2"
bucket_name = "naelao-blackboard-agent-scripts-test"

[vars]
PLATFORM_SECRET = "blackboard-integration-test-secret"
ENVIRONMENT = "test"
NAELAO_AIG_TOKEN = "test-only-model-gateway-token"
CF_API_TOKEN = "test-only-model-gateway-token"
